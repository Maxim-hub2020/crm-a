<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCRM Ultimate</title>
    
    <!-- Стили и иконки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Библиотеки для PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
    </script>
    
    <style>
        body { background-color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; overflow: hidden; }
        .kanban-scroll::-webkit-scrollbar { height: 10px; }
        .kanban-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .btn-hover:active { transform: scale(0.96); transition: 0.1s; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .mic-active { animation: pulse-red 1.5s infinite; background-color: #EF4444 !important; border-color: #EF4444 !important; color: white !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .step-segment { height: 8px; border-radius: 4px; background-color: #E5E7EB; flex: 1; cursor: pointer; transition: 0.2s; }
        .step-segment.active { background-color: #3B82F6; }
        .step-segment.completed { background-color: #84CC16; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slide-up { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast { animation: slide-up 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as Lucide from 'lucide-react';
        import { initializeApp, getApps, getApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, getDoc, query, where, orderBy } from 'firebase/firestore';

        const { 
            LayoutDashboard, Users, Wallet, Settings, X, Briefcase, Phone, Mail, Trash2, Check, 
            CreditCard, Tag, Sparkles, Calculator, Layers, MessageSquare, User, HelpCircle, 
            CheckCircle2, Pencil, Copy, AtSign, Send, Crown, Loader2, Mic, MicOff, Hash, 
            Users2, Lock, Plus, LogOut, Sliders, ChevronRight, FileDown, ExternalLink, ListTodo
        } = Lucide;

        // ==================================================================================
        // ВНИМАНИЕ! ЗАМЕНИТЕ ЭТОТ БЛОК НА ВАШИ ДАННЫЕ ИЗ FIREBASE
        // ==================================================================================
       const firebaseConfig = {
    		apiKey: "AIzaSyDl3vMtK203-TTFJ9KiVx7eHCVoAP1f_X4",
   		authDomain: "crm-a-65f00.firebaseapp.com",
    		projectId: "crm-a-65f00",
    		storageBucket: "crm-a-65f00.firebasestorage.app",
    		messagingSenderId: "427479091195",
    		appId: "1:427479091195:web:fa3cd7b4c5c7dc9a42ad5e",
    		measurementId: "G-R0CNPHZ5R9"
  };
        // ==================================================================================
        
        const appId = 'crm-pro-v1';

        // Инициализация Firebase
        let app, auth, db;
        try {
            app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Ошибка инициализации Firebase. Вы вставили ключи?", e);
        }

        // --- HELPER FUNCTIONS ---
        const TAB_NAMES = { kanban: 'Проекты', finances: 'Финансы', clients: 'Клиенты', tasks: 'Задачи', settings: 'Система' };

        const copyToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); alert(`Скопировано!`); } catch (err) { prompt("Скопируйте вручную:", text); }
            document.body.removeChild(textArea);
        };

        // --- ATOMIC COMPONENTS ---
        const Label = ({children}) => <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">{children}</label>;
        const Input = ({ label, ...props }) => (<div className="space-y-1.5 w-full text-left">{label && <Label>{label}</Label>}<input {...props} className={`w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm ${props.className || ''}`} /></div>);
        const Select = ({ label, children, ...props }) => (<div className="space-y-1.5 w-full text-left">{label && <Label>{label}</Label>}<select {...props} className={`w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm ${props.className || ''}`}>{children}</select></div>);
        const PrimaryBtn = ({ children, onClick, className = "", ...props }) => (<button onClick={onClick} className={`btn-hover bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-semibold shadow-lg hover:bg-black flex items-center justify-center gap-2 ${className}`} {...props}>{children}</button>);
        const Modal = ({ title, children, onClose, width = "max-w-md" }) => (
            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-md z-[150] flex items-center justify-center p-4" onClick={onClose}>
                <div className={`bg-white rounded-[32px] shadow-2xl w-full ${width} max-h-[95vh] flex flex-col overflow-hidden animate-in zoom-in duration-200`} onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center px-8 py-4 border-b border-gray-100 shrink-0">
                        <h2 className="text-xl font-bold text-gray-900 truncate pr-4 uppercase tracking-tight">{title}</h2>
                        <button onClick={onClose} className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors"><X className="w-5 h-5 text-gray-500" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 no-scrollbar">{children}</div>
                </div>
            </div>
        );
        const NavItem = ({ icon, label, active, onClick, badge }) => (
            <button onClick={onClick} className={`group/nav w-full flex items-center p-3 rounded-2xl transition-all duration-200 mb-1 ${active ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:bg-white/50 hover:text-gray-700'}`}>
                <div className="flex items-center justify-center w-6 h-6 shrink-0"><span className={active ? 'text-blue-600' : 'opacity-70'}>{icon}</span></div>
                <span className="ml-3 font-medium text-sm whitespace-nowrap opacity-0 group-hover/aside:opacity-100 transition-all duration-300">{label}</span>
                {badge > 0 && <span className="ml-auto bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm opacity-0 group-hover/aside:opacity-100">{badge}</span>}
            </button>
        );
        const SettingsCard = ({ title, icon, children }) => (
            <div className="glass-panel rounded-3xl border border-white/50 overflow-hidden shadow-sm mb-6">
                <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/30 flex items-center gap-2 text-gray-900 font-semibold"><div className="text-indigo-600">{icon}</div><h3 className="truncate uppercase text-xs font-black tracking-widest">{title}</h3></div>
                <div className="p-6">{children}</div>
            </div>
        );

        // --- SUB-MODULES ---
        function CompanyIdCard({ user, db, appId, companyCode, setCompanyCode }) {
            useEffect(() => {
                if (!user || companyCode) return;
                const fetchCode = async () => {
                    const userSettingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'general');
                    const snap = await getDoc(userSettingsRef);
                    if (snap.exists() && snap.data().companyCode) {
                        setCompanyCode(snap.data().companyCode);
                    } else {
                        const newCode = Math.floor(100000 + Math.random() * 900000).toString();
                        await setDoc(userSettingsRef, { companyCode: newCode }, { merge: true });
                        setCompanyCode(newCode);
                    }
                };
                fetchCode();
            }, [user, companyCode]);
            return ( <div className="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 flex items-center justify-between mb-4"><div><div className="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">Код Вашей Компании</div><div className="font-mono text-3xl font-black text-indigo-700 tracking-widest">{companyCode || '...'}</div></div><button onClick={() => copyToClipboard(companyCode)} className="p-3 bg-white hover:bg-indigo-100 rounded-xl transition-colors text-indigo-600 shadow-sm"><Copy size={20}/></button></div> );
        }
        
        function TeamManager({ user, db, managers }) {
            const [email, setEmail] = useState(''); 
            const [name, setName] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const add = async () => {
                if (!email || !name || !password) {
                    alert("Пожалуйста, заполните все поля: Имя, Email и Пароль.");
                    return;
                }
                setLoading(true);

                const tempAppName = `temp-auth-app-${Date.now()}`;
                const tempApp = initializeApp(firebaseConfig, tempAppName);
                const tempAuth = getAuth(tempApp);

                try {
                    const userCredential = await createUserWithEmailAndPassword(tempAuth, email, password);
                    const newManagerUser = userCredential.user;

                    const managerRef = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'managers'), {
                        uid: newManagerUser.uid,
                        email,
                        name,
                        role: 'manager',
                        createdAt: serverTimestamp()
                    });
                    
                    await setDoc(doc(db, 'user_roles', newManagerUser.uid), {
                        role: 'manager',
                        adminId: user.uid,
                        managerDocId: managerRef.id
                    });

                    await signOut(tempAuth);
                    
                    setEmail('');
                    setName('');
                    setPassword('');
                    alert(`Менеджер "${name}" успешно создан!`);
                } catch (error) {
                    let errorMessage = "Произошла неизвестная ошибка.";
                    switch(error.code) {
                        case 'auth/email-already-in-use': errorMessage = 'Ошибка: Этот email уже используется.'; break;
                        case 'auth/weak-password': errorMessage = 'Ошибка: Пароль слишком слабый (минимум 6 символов).'; break;
                        case 'permission-denied': errorMessage = "Ошибка прав доступа. Убедитесь, что правила безопасности Firebase настроены правильно."; break;
                        default: errorMessage = `Ошибка при создании менеджера: ${error.message}`; break;
                    }
                    alert(errorMessage);
                } finally {
                    setLoading(false);
                }
            };

            const handleDelete = async (manager) => {
                 if (confirm(`Вы уверены, что хотите удалить менеджера ${manager.name}? Это действие нельзя отменить.`)) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'managers', manager.id));
                        if(manager.uid) {
                            await deleteDoc(doc(db, 'user_roles', manager.uid));
                        }
                        alert(`Менеджер ${manager.name} удален.`);
                    } catch (error) {
                        alert(`Не удалось удалить менеджера: ${error.message}`);
                    }
                 }
            };

            return (
                <div className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2 items-center">
                        <Input value={name} onChange={e=>setName(e.target.value)} placeholder="Имя" className="flex-1"/>
                        <Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="flex-1"/>
                        <Input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Пароль (min 6 символов)" className="flex-1"/>
                    </div>
                    <button onClick={add} disabled={loading} className="w-full bg-slate-900 text-white px-4 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-black transition-all disabled:bg-slate-400">
                        {loading ? <Loader2 className="animate-spin mx-auto" /> : '+ Добавить в команду'}
                    </button>
                    <div className="space-y-2 pt-4">
                        {managers.map(m => (
                            <div key={m.id} className="flex justify-between items-center p-3 bg-white border rounded-xl">
                                <div>
                                    <div className="font-bold text-sm">{m.name}</div>
                                    <div className="text-xs text-slate-400">{m.email}</div>
                                </div>
                                <button onClick={() => handleDelete(m)} className="text-slate-300 hover:text-red-500 p-1"><Trash2 size={16}/></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- FORMS ---
        function ClientForm({ user, db, client, onClose, managers, userRole, managerDocId, adminId, companyCode }) {
            const [name, setName] = useState(client?.name || '');
            const [phone, setPhone] = useState(client?.phone || '');
            const [contactEmail, setContactEmail] = useState(client?.email || '');
            const [notes, setNotes] = useState(client?.notes || '');
            const [managerId, setManagerId] = useState(managerDocId || client?.managerId || (managers.length > 0 ? managers[0].id : ''));
            
            const [generatedCredentials, setGeneratedCredentials] = useState(null);
            const [isCreating, setIsCreating] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!name || !adminId) return;

                if (client) { // Editing existing client
                    const data = { name, phone, email: contactEmail, notes, managerId };
                    try {
                        await updateDoc(doc(db, 'artifacts', appId, 'users', adminId, 'clients', client.id), data);
                        onClose();
                    } catch (err) { alert(err.message); }
                } else { // Creating a new client
                    setIsCreating(true);
                    try {
                        if (!companyCode) {
                            alert("Не удалось получить код компании. Перезагрузите страницу.");
                            setIsCreating(false);
                            return;
                        }
                        const randomPart = Math.random().toString(36).substring(2, 8);
                        const newClientEmail = `client-${companyCode}-${randomPart}@crm.app`;
                        const newClientPassword = Math.random().toString(36).substring(2, 10);

                        const tempAppName = `client-creator-${Date.now()}`;
                        const tempApp = initializeApp(firebaseConfig, tempAppName);
                        const tempAuth = getAuth(tempApp);
                        const userCredential = await createUserWithEmailAndPassword(tempAuth, newClientEmail, newClientPassword);
                        const newClientUser = userCredential.user;
                        await signOut(tempAuth);

                        const clientDocRef = await addDoc(collection(db, 'artifacts', appId, 'users', adminId, 'clients'), {
                            name, phone, email: contactEmail, notes, managerId,
                            uid: newClientUser.uid,
                            adminId: adminId,
                            role: 'client'
                        });

                        await setDoc(doc(db, 'user_roles', newClientUser.uid), {
                            role: 'client',
                            adminId: adminId,
                            clientId: clientDocRef.id
                        });

                        setGeneratedCredentials({ email: newClientEmail, password: newClientPassword });
                    } catch (err) {
                         let errorMessage = "Произошла неизвестная ошибка.";
                        switch (err.code) {
                            case 'auth/email-already-in-use': errorMessage = "Этот email уже используется другим аккаунтом."; break;
                            case 'auth/weak-password': errorMessage = "Пароль слишком слабый (минимум 6 символов)."; break;
                            case 'permission-denied': errorMessage = "Ошибка прав доступа. Убедитесь, что правила безопасности Firebase настроены правильно."; break;
                            default: errorMessage = "Пожалуйста, проверьте настройки Firebase и обновите правила безопасности."; break;
                        }
                        alert(errorMessage);
                    } finally {
                        setIsCreating(false);
                    }
                }
            };

            if (generatedCredentials) {
                return (
                    <div className="p-8 space-y-4 text-center">
                        <h2 className="text-2xl font-bold text-gray-900 tracking-tight uppercase">Клиент создан!</h2>
                        <p className="text-sm text-gray-500">Передайте эти данные клиенту для входа в его личный кабинет.</p>
                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-3">
                            <div><Label>Email для входа</Label><div className="text-lg font-mono font-bold text-blue-700">{generatedCredentials.email}</div></div>
                            <div><Label>Пароль</Label><div className="text-lg font-mono font-bold text-blue-700">{generatedCredentials.password}</div></div>
                        </div>
                        <button onClick={() => copyToClipboard(`Email: ${generatedCredentials.email}\nПароль: ${generatedCredentials.password}`)} className="w-full bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-xs uppercase hover:bg-gray-200">Копировать</button>
                        <PrimaryBtn onClick={onClose} className="w-full py-4 uppercase font-black text-xs tracking-widest">Закрыть</PrimaryBtn>
                    </div>
                );
            }

            return (
                <form onSubmit={handleSubmit} className="p-8 space-y-4">
                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight uppercase mb-2">{client ? 'Редактировать' : 'Новый клиент'}</h2>
                    <Input label="Имя / Компания *" required value={name} onChange={e => setName(e.target.value)} />
                    <Input label="Контактный Телефон" value={phone} onChange={e => setPhone(e.target.value)} />
                    <Input label="Контактный Email" type="email" value={contactEmail} onChange={e => setContactEmail(e.target.value)} />
                    {userRole === 'admin' && (
                        <Select label="Менеджер" value={managerId} onChange={e => setManagerId(e.target.value)}>
                            {managers.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </Select>
                    )}
                    <div><Label>Заметки</Label><textarea value={notes} onChange={e => setNotes(e.target.value)} className="w-full border border-gray-200 rounded-xl p-2.5 outline-none min-h-[100px]"></textarea></div>
                    <PrimaryBtn type="submit" disabled={isCreating} className="w-full py-4 uppercase font-black text-xs tracking-widest">
                         {isCreating ? <Loader2 className="animate-spin mx-auto"/> : (client ? 'Сохранить' : 'Создать и сгенерировать доступ')}
                    </PrimaryBtn>
                </form>
            );
        }

        function AuthScreen({ auth }) {
            const [isLoginView, setIsLoginView] = useState(true);
            const [mode, setMode] = useState('staff');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (mode === 'staff' && !isLoginView) {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                } catch (err) {
                    let errorMessage = "Произошла неизвестная ошибка. Пожалуйста, проверьте настройки Firebase.";
                    switch (err.code) {
                        case 'auth/user-not-found': errorMessage = "Пользователь с таким email не найден."; break;
                        case 'auth/wrong-password': errorMessage = "Неверный пароль. Попробуйте еще раз."; break;
                        case 'auth/invalid-email': errorMessage = "Вы ввели некорректный email адрес."; break;
                        case 'auth/email-already-in-use': errorMessage = "Этот email уже используется другим аккаунтом."; break;
                        case 'auth/weak-password': errorMessage = "Пароль слишком слабый. Он должен содержать не менее 6 символов."; break;
                        case 'auth/operation-not-allowed': errorMessage = "Вход по email и паролю не включен в настройках Firebase. Пожалуйста, включите его."; break;
                        case 'permission-denied': errorMessage = "Ошибка прав доступа. Убедитесь, что правила безопасности Firebase настроены правильно."; break;
                    }
                    alert(errorMessage);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex h-screen items-center justify-center bg-[#F5F5F7] p-4">
                    <div className="w-full max-w-md bg-white p-10 rounded-[40px] shadow-2xl ring-1 ring-black/5">
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-black rounded-2xl flex items-center justify-center text-white shadow-lg"><Briefcase size={32} /></div></div>
                        <div className="flex bg-slate-100 p-1 rounded-xl mb-8">
                            <button onClick={() => setMode('staff')} className={`flex-1 py-3 text-xs font-black uppercase rounded-lg transition-all ${mode === 'staff' ? 'bg-white shadow-sm text-black' : 'text-slate-400'}`}>Сотрудник</button>
                            <button onClick={() => setMode('client')} className={`flex-1 py-3 text-xs font-black uppercase rounded-lg transition-all ${mode === 'client' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'}`}>Клиент</button>
                        </div>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <h3 className="text-center font-bold text-lg">{mode === 'staff' ? (isLoginView ? 'Вход для сотрудника' : 'Регистрация компании') : 'Вход для клиента'}</h3>
                            <Input placeholder="Email" type="email" value={email} onChange={e => setEmail(e.target.value)} required />
                            <Input placeholder="Пароль" type="password" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="submit" disabled={loading} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition-all shadow-lg uppercase tracking-widest text-xs">
                                {loading ? <Loader2 className="animate-spin mx-auto" /> : (mode === 'staff' && !isLoginView ? 'Зарегистрироваться' : 'Войти')}
                            </button>
                            {mode === 'staff' && (
                                <div className="text-center mt-2">
                                    <button type="button" onClick={() => setIsLoginView(!isLoginView)} className="text-xs text-slate-400 font-bold hover:text-black uppercase tracking-widest">
                                        {isLoginView ? 'Создать аккаунт компании' : 'Уже есть аккаунт? Войти'}
                                    </button>
                                </div>
                            )}
                        </form>
                    </div>
                </div>
            );
        }

        function KanbanView({ stages, deals, clients, setEditingDeal, managers, userRole, adminId, db, appId }) {
            const getClientName = (id) => { const c = clients.find(c => c.id === id); return c ? c.name : 'Без клиента'; };
            const getManagerName = (id) => { const m = managers.find(m => m.id === id); return m ? m.name : 'Не назначен'; };
            
            const onDragEnd = (result) => {
                const { destination, source, draggableId } = result;
                if (!destination) return;
                if (destination.droppableId === source.droppableId && destination.index === source.index) return;
                const deal = deals.find(d => d.id === draggableId);
                if (deal && deal.stageId !== destination.droppableId) {
                    const dealRef = doc(db, 'artifacts', appId, 'users', adminId, 'deals', draggableId);
                    updateDoc(dealRef, { stageId: destination.droppableId });
                }
            };

            return (
                <div className="kanban-scroll flex h-full space-x-6 overflow-x-auto pb-6 items-start">
                    {stages.map(stage => {
                        const stageDeals = deals.filter(d => d.stageId === stage.id);
                        const stageTotal = stageDeals.reduce((sum, d) => sum + Number(d.value || 0), 0);
                        return (
                            <div key={stage.id} className="flex-shrink-0 w-80 flex flex-col max-h-full bg-slate-200/20 rounded-[32px] p-2 border border-slate-100 shadow-inner">
                                <div className="flex justify-between items-center mb-3 px-4 pt-3 shrink-0"><h3 className="font-bold text-slate-900 text-[10px] uppercase tracking-widest opacity-40">{stage.name}</h3><span className="text-slate-400 font-black text-[10px] bg-white px-2 py-0.5 rounded-full">{stageTotal.toLocaleString()} ₽</span></div>
                                <div className="flex-1 overflow-y-auto space-y-3 p-1 min-h-[150px] no-scrollbar">
                                    {stageDeals.map(deal => (
                                        <div key={deal.id} onClick={() => { setEditingDeal(deal); }} className="bg-white p-6 rounded-[28px] shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer group ring-1 ring-black/[0.03] border border-transparent hover:border-blue-100">
                                            <h4 className="font-black text-slate-800 leading-tight mb-2 text-sm">{deal.title}</h4>
                                            <div className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-3 opacity-60">{getClientName(deal.clientId)}</div>
                                            {userRole === 'admin' && <div className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">{getManagerName(deal.managerId)}</div>}
                                            <div className="font-black text-slate-900 text-xs">{Number(deal.value||0).toLocaleString()} ₽</div>
                                        </div>
                                    ))}
                                    <button onClick={() => { setEditingDeal(null); }} className="w-full py-5 rounded-[24px] border-2 border-dashed border-slate-200 text-slate-300 hover:border-blue-400 hover:text-blue-500 transition-all text-[10px] font-black uppercase">Добавить проект</button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function ClientsView({ clients, setEditingClient, deleteClient, managers, userRole }) {
            const getManagerName = (id) => { const m = managers.find(m => m.id === id); return m ? m.name : 'Не назначен'; };

            return (
                <div className="glass-panel rounded-[32px] shadow-sm border border-white/50 overflow-hidden flex flex-col h-full animate-in fade-in">
                    <div className="p-6 border-b border-gray-100 bg-white/50 backdrop-blur-sm flex justify-between items-center">
                        <h2 className="text-xl font-black text-slate-900 tracking-tighter uppercase">База клиентов</h2>
                        <PrimaryBtn onClick={() => { setEditingClient(null); }} className="px-6 py-3 text-xs bg-blue-600 hover:bg-blue-700 shadow-blue-200"><Plus size={16}/> Добавить</PrimaryBtn>
                    </div>
                    <div className="flex-1 overflow-auto no-scrollbar">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50/50 text-gray-400 text-[10px] uppercase tracking-widest font-black border-b sticky top-0 backdrop-blur-sm z-10">
                                <tr>
                                    <th className="p-6">Клиент</th>
                                    <th className="p-6">Телефон</th>
                                    <th className="p-6">Email</th>
                                    {userRole === 'admin' && <th className="p-6">Менеджер</th>}
                                    <th className="p-6 text-right"></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 bg-white/40">
                                {clients.map(c => (
                                    <tr key={c.id} className="hover:bg-white/80 transition-colors group">
                                        <td className="p-6 font-bold text-gray-900 cursor-pointer" onClick={() => { setEditingClient(c); }}>{c.name}</td>
                                        <td className="p-6 text-sm font-medium cursor-pointer" onClick={() => { setEditingClient(c); }}>{c.phone}</td>
                                        <td className="p-6 text-sm font-medium cursor-pointer" onClick={() => { setEditingClient(c); }}>{c.email}</td>
                                        {userRole === 'admin' && <td className="p-6 text-sm font-medium">{getManagerName(c.managerId)}</td>}
                                        <td className="p-6 text-right">
                                            <button onClick={(e) => { e.stopPropagation(); deleteClient(c.id); }} className="text-red-500 opacity-0 group-hover:opacity-100">
                                                <Trash2 size={16} />
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {clients.length === 0 && <div className="p-20 text-center text-gray-300 font-black uppercase tracking-widest text-[10px]">Список пуст</div>}
                    </div>
                </div>
            );
        }

        function SettingsView({ user, appId, db, managers, companyCode, setCompanyCode }) {
             return (
                <div className="max-w-3xl mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
                    <SettingsCard title="Код Компании" icon={<Hash size={18}/>}><CompanyIdCard user={user} db={db} appId={appId} companyCode={companyCode} setCompanyCode={setCompanyCode} /></SettingsCard>
                    <SettingsCard title="Команда" icon={<Users2 size={18}/>}><TeamManager user={user} db={db} managers={managers} /></SettingsCard>
                </div>
            );
        }
        
        const FinancesView = () => <div className="text-center p-20">Раздел Финансов в разработке</div>;
        const TasksView = () => <div className="text-center p-20">Раздел Задач в разработке</div>;

        // --- MAIN APP ---
        function App() {
            const [user, setUser] = useState(null);
            const [loadingAuth, setLoadingAuth] = useState(true);
            const [activeTab, setActiveTab] = useState('kanban');
            
            const [userRole, setUserRole] = useState(null);
            const [adminId, setAdminId] = useState(null);
            const [managerDocId, setManagerDocId] = useState(null);
            const [clientId, setClientId] = useState(null);
            const [companyCode, setCompanyCode] = useState(null);

            const [stages, setStages] = useState([]);
            const [deals, setDeals] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [clients, setClients] = useState([]);
            const [categories, setCategories] = useState([]);
            const [accounts, setAccounts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [customFields, setCustomFields] = useState([]);
            const [managers, setManagers] = useState([]);
            
            const [clientDeals, setClientDeals] = useState([]);
            const [clientStages, setClientStages] = useState([]);

            const [isDealModalOpen, setIsDealModalOpen] = useState(false);
            const [editingDeal, setEditingDeal] = useState(null);
            const [isClientModalOpen, setIsClientModalOpen] = useState(false);
            const [editingClient, setEditingClient] = useState(null);
            const [isTxModalOpen, setIsTxModalOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        const roleDocRef = doc(db, 'user_roles', u.uid);
                        const roleDocSnap = await getDoc(roleDocRef);
                        if (roleDocSnap.exists()) {
                            const { role, adminId, managerDocId, clientId } = roleDocSnap.data();
                            setUser(u);
                            setUserRole(role);
                            setAdminId(adminId);
                            setManagerDocId(managerDocId || null);
                            setClientId(clientId || null);
                        } else {
                            // First sign-in, create admin role
                            await setDoc(roleDocRef, { role: 'admin', adminId: u.uid });
                            setUser(u); setUserRole('admin'); setAdminId(u.uid);
                        }
                    } else {
                        setUser(null); setUserRole(null); setAdminId(null); setManagerDocId(null); setClientId(null);
                        setDeals([]); setStages([]); setClientDeals([]); setClientStages([]);
                    }
                    setLoadingAuth(false);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!adminId) return;

                if (userRole === 'admin' || userRole === 'manager') {
                    const getPath = (c) => collection(db, 'artifacts', appId, 'users', adminId, c);
                    const unsubArr = [
                        onSnapshot(query(getPath('stages'), orderBy('order')), s => setStages(s.docs.map(d => ({ id: d.id, ...d.data() })))),
                        onSnapshot(getPath('deals'), s => setDeals(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('tasks'), s => setTasks(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('clients'), s => setClients(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('categories'), s => setCategories(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('transactions'), s => setTransactions(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('customFields'), s => setCustomFields(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('managers'), s => setManagers(s.docs.map(d => ({id:d.id, ...d.data()})))),
                        onSnapshot(getPath('accounts'), s => setAccounts(s.docs.map(d => ({id:d.id, ...d.data()})))
                    ];
                    const userSettingsRef = doc(db, 'artifacts', appId, 'users', adminId, 'settings', 'general');
                    getDoc(userSettingsRef).then(snap => {
                        if (snap.exists() && snap.data().companyCode) setCompanyCode(snap.data().companyCode);
                    });
                    return () => unsubArr.forEach(un => un());
                }

                if (userRole === 'client' && clientId) {
                    const unsubArr = [
                        onSnapshot(query(collection(db, 'artifacts', appId, 'users', adminId, 'stages'), orderBy('order')), snap => setClientStages(snap.docs.map(d => ({ id: d.id, ...d.data() })))),
                        onSnapshot(query(collection(db, 'artifacts', appId, 'users', adminId, 'deals'), where('clientId', '==', clientId)), snap => setClientDeals(snap.docs.map(d => ({ id: d.id, ...d.data() }))))
                    ];
                    return () => unsubArr.forEach(un => un());
                }
            }, [adminId, userRole, clientId]);

            const visibleDeals = useMemo(() => {
                if (userRole === 'manager' && managerDocId) return deals.filter(deal => deal.managerId === managerDocId);
                return deals;
            }, [deals, userRole, managerDocId]);
            
            const visibleClients = useMemo(() => {
                if (userRole === 'manager' && managerDocId) return clients.filter(c => c.managerId === managerDocId);
                return clients;
            }, [clients, userRole, managerDocId]);
            
            const deleteDeal = async (id) => { if(adminId && confirm("Удалить проект?")) await deleteDoc(doc(db, 'artifacts', appId, 'users', adminId, 'deals', id)); setIsDealModalOpen(false); };

            const deleteClient = async (id) => {
                 if(confirm("Удалить клиента? Его аккаунт для входа будет деактивирован.") && adminId) {
                     const clientToDelete = clients.find(c=>c.id === id);
                     if(clientToDelete?.uid){
                         await deleteDoc(doc(db, 'user_roles', clientToDelete.uid));
                     }
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', adminId, 'clients', id));
                 }
             };

            if (loadingAuth) return <div className="h-screen flex items-center justify-center bg-gray-50"><Loader2 className="animate-spin text-blue-600" size={48}/></div>;

            if (userRole === 'client') {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-2xl bg-white rounded-[32px] p-8 shadow-xl animate-in zoom-in duration-300">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-black">Мои заказы</h1>
                                <button onClick={() => signOut(auth)} className="text-red-500 font-bold uppercase text-[10px]">Выход</button>
                            </div>
                            {clientDeals.length > 0 ? clientDeals.map(deal => {
                                const currentStageIdx = clientStages.findIndex(s => s.id === deal.stageId);
                                return (
                                    <div key={deal.id} className="mb-8 border-b pb-8 last:border-b-0 last:pb-0">
                                        <h2 className="text-xl font-bold mb-6 text-slate-800">{deal.title}</h2>
                                        <div className="space-y-6 mb-8 relative pl-6 border-l-2 border-slate-100 ml-3">
                                            {clientStages.map((s, i) => (
                                                <div key={i} className="flex items-center gap-4 relative">
                                                    <div className={`absolute -left-[29px] w-6 h-6 rounded-full border-4 border-white shadow-sm flex items-center justify-center ${i <= currentStageIdx ? 'bg-blue-600 border-blue-600' : 'bg-white border-slate-300'}`}>{i <= currentStageIdx && <Check size={10} className="text-white" />}</div>
                                                    <div className={`text-sm font-medium ${i <= currentStageIdx ? 'text-slate-900 font-bold' : 'text-slate-300'}`}>{s.name}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="bg-slate-900 text-white p-6 rounded-2xl text-center">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-widest">К оплате</div>
                                            <div className="text-3xl font-black tracking-tight">{Number(deal.value || 0).toLocaleString()} ₽</div>
                                        </div>
                                    </div>
                                );
                            }) : <p className="text-center text-gray-400 py-10">У вас пока нет заказов.</p>}
                        </div>
                    </div>
                );
            }

            if (!user) return <AuthScreen auth={auth} />;
            
            return (
                <div className="flex h-screen overflow-hidden relative selection:bg-blue-100">
                    <aside className="group/aside w-20 hover:w-64 transition-all duration-300 ease-in-out glass flex flex-col shrink-0 z-50 border-r border-slate-200/50 overflow-hidden">
                        <div className="h-20 flex items-center justify-center md:justify-start md:px-8 border-b border-slate-100"><div className="bg-slate-900 p-2 rounded-2xl text-white shadow-lg shrink-0"><Briefcase size={24}/></div><span className="ml-3 font-black text-2xl tracking-tighter uppercase opacity-0 group-hover/aside:opacity-100 transition-opacity duration-300 whitespace-nowrap">ProCRM</span></div>
                        <nav className="flex-1 mt-10 px-4 space-y-1">
                            <NavItem icon={<LayoutDashboard size={22}/>} label="Проекты" active={activeTab === 'kanban'} onClick={()=>setActiveTab('kanban')} />
                            <NavItem icon={<Wallet size={22}/>} label="Финансы" active={activeTab === 'finances'} onClick={()=>setActiveTab('finances')} />
                            <NavItem icon={<ListTodo size={22}/>} label="Задачи" active={activeTab === 'tasks'} onClick={()=>setActiveTab('tasks')} />
                            <NavItem icon={<Users size={22}/>} label="Клиенты" active={activeTab === 'clients'} onClick={()=>setActiveTab('clients')} badge={visibleClients.length} />
                            {userRole === 'admin' && <NavItem icon={<Settings size={22}/>} label="Система" active={activeTab === 'settings'} onClick={()=>setActiveTab('settings')} />}
                        </nav>
                        <div className="p-4 border-t border-slate-100 text-center shrink-0"><button onClick={()=>signOut(auth)} className="text-slate-400 hover:text-red-500 transition-colors font-black text-[10px] flex items-center justify-center gap-1 w-full py-4 hover:bg-red-50 rounded-2xl uppercase tracking-widest"><LogOut size={16}/> <span className="opacity-0 group-hover/aside:opacity-100 transition-opacity duration-300 ml-2">Выход</span></button></div>
                    </aside>

                    <div className="flex-1 flex flex-col min-w-0 bg-[#F5F5F7]">
                        <header className="h-20 flex items-center justify-between px-10 shrink-0 bg-white/50 backdrop-blur-md z-10 border-b">
                            <h1 className="text-2xl font-black text-slate-900 tracking-tight uppercase truncate">{TAB_NAMES[activeTab]}</h1>
                             <div className="flex gap-4">
                                {activeTab === 'kanban' && <PrimaryBtn onClick={()=>{setEditingDeal(null); setIsDealModalOpen(true);}}><Plus size={18}/> Проект</PrimaryBtn>}
                                {activeTab === 'finances' && <PrimaryBtn onClick={()=>{setEditingTx(null); setIsTxModalOpen(true);}} className="bg-emerald-600 hover:bg-emerald-700 shadow-emerald-100"><Plus size={18}/> Операция</PrimaryBtn>}
                                {activeTab === 'clients' && <PrimaryBtn onClick={()=>{setEditingClient(null); setIsClientModalOpen(true);}} className="bg-blue-600 hover:bg-blue-700 shadow-blue-100"><Plus size={18}/> Клиент</PrimaryBtn>}
                            </div>
                        </header>
                        <main className="flex-1 overflow-auto p-10 pt-4 relative no-scrollbar">
                           {activeTab === 'kanban' && <KanbanView stages={stages} deals={visibleDeals} clients={visibleClients} setEditingDeal={(d)=>{ setEditingDeal(d); setIsDealModalOpen(true);}} managers={managers} userRole={userRole} adminId={adminId} db={db} appId={appId} />}
                           {activeTab === 'finances' && <FinancesView />}
                           {activeTab === 'tasks' && <TasksView />}
                           {activeTab === 'clients' && <ClientsView clients={visibleClients} setEditingClient={(c)=>{setEditingClient(c); setIsClientModalOpen(true);}} deleteClient={deleteClient} managers={managers} userRole={userRole} />}
                           {activeTab === 'settings' && userRole === 'admin' && <SettingsView user={user} appId={appId} db={db} managers={managers} companyCode={companyCode} setCompanyCode={setCompanyCode} />}
                        </main>
                    </div>

                    {isDealModalOpen && <Modal title={editingDeal?.title || "Новый Проект"} onClose={()=>{setIsDealModalOpen(false); setEditingDeal(null);}} width="max-w-6xl"><p>Deal Form/Manager not implemented yet</p></Modal>}
                    {isClientModalOpen && <Modal title={editingClient ? "Карточка клиента" : "Новый клиент"} onClose={()=>{setIsClientModalOpen(false); setEditingClient(null);}}><ClientForm user={user} db={db} client={editingClient} onClose={()=>setIsClientModalOpen(false)} managers={managers} userRole={userRole} managerDocId={managerDocId} adminId={adminId} companyCode={companyCode} /></Modal>}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
