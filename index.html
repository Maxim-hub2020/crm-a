<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCRM Ultimate</title>
    
    <!-- Стили и иконки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Библиотеки для PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
    </script>
    
    <style>
        body { background-color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; overflow: hidden; }
        .kanban-scroll::-webkit-scrollbar { height: 10px; }
        .kanban-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .btn-hover:active { transform: scale(0.96); transition: 0.1s; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .mic-active { animation: pulse-red 1.5s infinite; background-color: #EF4444 !important; border-color: #EF4444 !important; color: white !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .step-segment { height: 8px; border-radius: 4px; background-color: #E5E7EB; flex: 1; cursor: pointer; transition: 0.2s; }
        .step-segment.active { background-color: #3B82F6; }
        .step-segment.completed { background-color: #84CC16; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slide-up { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast { animation: slide-up 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as Lucide from 'lucide-react';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, getDoc, query, where, orderBy, getDocs } from 'firebase/firestore';

        const { 
            LayoutDashboard, Users, Wallet, Settings, X, Briefcase, Phone, Mail, Trash2, Check, 
            CreditCard, Tag, Sparkles, Calculator, Layers, MessageSquare, User, HelpCircle, 
            CheckCircle2, Pencil, Copy, AtSign, Send, Crown, Loader2, Mic, MicOff, Hash, 
            Users2, Lock, Plus, LogOut, Sliders, ChevronRight, FileDown, ExternalLink, ListTodo
        } = Lucide;

        // ==================================================================================
        // ВНИМАНИЕ! ЗАМЕНИТЕ ЭТОТ БЛОК НА ВАШИ ДАННЫЕ ИЗ FIREBASE
        // ==================================================================================
       const firebaseConfig = {
    		apiKey: "AIzaSyDl3vMtK203-TTFJ9KiVx7eHCVoAP1f_X4",
   		authDomain: "crm-a-65f00.firebaseapp.com",
    		projectId: "crm-a-65f00",
    		storageBucket: "crm-a-65f00.firebasestorage.app",
    		messagingSenderId: "427479091195",
    		appId: "1:427479091195:web:fa3cd7b4c5c7dc9a42ad5e",
    		measurementId: "G-R0CNPHZ5R9"
  };
        // ==================================================================================
        
        const appId = 'crm-pro-v1';
        const apiKey = ""; // API Key для Gemini (если есть)

        // Инициализация Firebase
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Ошибка инициализации Firebase. Вы вставили ключи?", e);
        }

        // --- HELPER FUNCTIONS ---
        const TAB_NAMES = { kanban: 'Доска проектов', finances: 'Финансы', calculator: 'Калькулятор', clients: 'Клиенты', tasks: 'Задачи', settings: 'Настройки' };

        const copyToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); alert(`Скопировано!`); } catch (err) { prompt("Скопируйте вручную:", text); }
            document.body.removeChild(textArea);
        };

        const localCommandParser = (text) => {
            const lower = text.toLowerCase();
            const today = new Date().toISOString().split('T')[0];
            if (lower.includes("проект") || lower.includes("сделка") || lower.includes("заказ")) {
                 const title = text.replace(/создать проект|новая сделка|проект|сделка|заказ/gi, '').trim();
                 return { action: "create_deal", data: { title: title.charAt(0).toUpperCase() + title.slice(1) || "Новый проект", value: 0 } };
            }
            const title = text.replace(/создать задачу|добавить задачу|задача|напомнить/gi, '').trim();
            return { action: "create_task", data: { title: (title.charAt(0).toUpperCase() + title.slice(1)) || "Голосовая заметка", dueDate: today } };
        };

        // --- ATOMIC COMPONENTS ---
        const Label = ({children}) => <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">{children}</label>;
        const Input = ({ label, ...props }) => (<div className="space-y-1.5 w-full text-left">{label && <Label>{label}</Label>}<input {...props} className={`w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm ${props.className || ''}`} /></div>);
        const Select = ({ label, children, ...props }) => (<div className="space-y-1.5 w-full text-left">{label && <Label>{label}</Label>}<select {...props} className={`w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm ${props.className || ''}`}>{children}</select></div>);
        const PrimaryBtn = ({ children, onClick, className = "" }) => (<button onClick={onClick} className={`btn-hover bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-semibold shadow-lg hover:bg-black flex items-center justify-center gap-2 ${className}`}>{children}</button>);
        const Modal = ({ title, children, onClose, width = "max-w-md" }) => (
            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-md z-[150] flex items-center justify-center p-4" onClick={onClose}>
                <div className={`bg-white rounded-[32px] shadow-2xl w-full ${width} max-h-[95vh] flex flex-col overflow-hidden animate-in zoom-in duration-200`} onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center px-8 py-4 border-b border-gray-100 shrink-0">
                        <h2 className="text-xl font-bold text-gray-900 truncate pr-4 uppercase tracking-tight">{title}</h2>
                        <button onClick={onClose} className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors"><X className="w-5 h-5 text-gray-500" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 no-scrollbar">{children}</div>
                </div>
            </div>
        );
        const NavItem = ({ icon, label, active, onClick, badge }) => (
            <button onClick={onClick} className={`group/nav w-full flex items-center p-3 rounded-2xl transition-all duration-200 mb-1 ${active ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:bg-white/50 hover:text-gray-700'}`}>
                <div className="flex items-center justify-center w-6 h-6 shrink-0"><span className={active ? 'text-blue-600' : 'opacity-70'}>{icon}</span></div>
                <span className="ml-3 font-medium text-sm whitespace-nowrap opacity-0 group-hover/aside:opacity-100 transition-all duration-300">{label}</span>
                {badge > 0 && <span className="ml-auto bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm opacity-0 group-hover/aside:opacity-100">{badge}</span>}
            </button>
        );
        const SettingsCard = ({ title, icon, children }) => (
            <div className="glass-panel rounded-3xl border border-white/50 overflow-hidden shadow-sm mb-6">
                <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/30 flex items-center gap-2 text-gray-900 font-semibold"><div className="text-indigo-600">{icon}</div><h3 className="truncate uppercase text-xs font-black tracking-widest">{title}</h3></div>
                <div className="p-6">{children}</div>
            </div>
        );

        // --- 4. SUB-MODULES ---
        function CompanyIdCard({ user, db, appId }) {
            const [companyCode, setCompanyCode] = useState('...');
            useEffect(() => {
                if (!user) return;
                const fetchCode = async () => {
                    try {
                        const userSettingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'general');
                        const snap = await getDoc(userSettingsRef);
                        if (snap.exists() && snap.data().companyCode) {
                            setCompanyCode(snap.data().companyCode);
                        } else {
                            const newCode = Math.floor(100000 + Math.random() * 900000).toString();
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'companies', newCode), { ownerId: user.uid });
                            await setDoc(userSettingsRef, { companyCode: newCode }, { merge: true });
                            setCompanyCode(newCode);
                        }
                    } catch (e) {
                        const fallbackCode = Math.floor(100000 + Math.random() * 900000).toString();
                        setCompanyCode(fallbackCode);
                    }
                };
                fetchCode();
            }, [user]);
            return ( <div className="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 flex items-center justify-between mb-4"><div><div className="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">Код Компании (Для входа клиентов)</div><div className="font-mono text-3xl font-black text-indigo-700 tracking-widest">{companyCode || '...'}</div></div><button onClick={() => copyToClipboard(companyCode)} className="p-3 bg-white hover:bg-indigo-100 rounded-xl transition-colors text-indigo-600 shadow-sm"><Copy size={20}/></button></div> );
        }
        function Manager({ user, db, items, col, placeholder }) {
            const [name, setName] = useState('');
            const handleAdd = async () => { if(!name.trim()) return; await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, col), { name: name.trim() }); setName(''); };
            return (<div className="space-y-3"><div className="flex gap-2"><Input value={name} onChange={e=>setName(e.target.value)} placeholder={placeholder} className="flex-1" /><button onClick={handleAdd} className="bg-gray-900 text-white px-4 rounded-xl font-bold">OK</button></div><div className="flex flex-wrap gap-2">{items.map(i => (<span key={i.id} className="bg-white border px-3 py-1.5 rounded-full flex items-center gap-2 text-xs font-bold uppercase text-gray-600 shadow-sm">{i.name}<button onClick={()=>deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, col, i.id))}><X className="w-3 h-3 hover:text-red-500"/></button></span>))}</div></div>);
        }
        function TeamManager({ user, db, managers }) {
            const [email, setEmail] = useState(''); const [name, setName] = useState('');
            const add = async () => { if(!email || !name) return; await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'managers'), { email, name, role: 'manager', createdAt: serverTimestamp() }); setEmail(''); setName(''); };
            return (<div className="space-y-4"><div className="flex gap-2"><Input value={name} onChange={e=>setName(e.target.value)} placeholder="Имя" className="flex-1"/><Input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="flex-1"/><button onClick={add} className="bg-slate-900 text-white px-4 rounded-xl font-bold">+</button></div><div className="space-y-2">{managers.map(m => (<div key={m.id} className="flex justify-between items-center p-3 bg-white border rounded-xl"><div><div className="font-bold text-sm">{m.name}</div><div className="text-xs text-slate-400">{m.email}</div></div><button onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'managers', m.id))} className="text-slate-200 hover:text-red-500"><Trash2 size={16}/></button></div>))}</div></div>);
        }
        function CategoryManager({ user, db, categories }) {
            const [name, setName] = useState(''); const [type, setType] = useState('income');
            const add = async () => { if(!name.trim()) return; await addDoc(collection(db,'artifacts',appId,'users',user.uid,'categories'), { name: name.trim(), type }); setName(''); };
            return (<div className="space-y-4"><div className="flex gap-2"><Input value={name} onChange={e=>setName(e.target.value)} placeholder="Название" className="flex-1" /><Select value={type} onChange={e=>setType(e.target.value)} className="w-32"><option value="income">Доход</option><option value="expense">Расход</option></Select><button onClick={add} className="bg-gray-900 text-white px-4 rounded-xl font-bold">OK</button></div><div className="flex flex-wrap gap-2">{categories.map(c => (<span key={c.id} className={`border px-3 py-1.5 rounded-full flex items-center gap-2 text-xs font-bold uppercase ${c.type==='income'?'bg-green-50 border-green-200 text-green-700':'bg-red-50 border-red-200 text-red-700'}`}>{c.name}<button onClick={()=>deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'categories',c.id))}><X className="w-3 h-3"/></button></span>))}</div></div>);
        }
        function CustomFieldManager({ user, db, customFields }) {
            const [name, setName] = useState('');
            const add = async () => { if(!name.trim()) return; await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'customFields'), { name: name.trim(), type: 'text' }); setName(''); };
            return (<div className="space-y-4"><div className="flex gap-2"><Input value={name} onChange={e=>setName(e.target.value)} placeholder="Название поля" className="flex-1" /><button onClick={add} className="bg-gray-900 text-white px-4 rounded-xl font-bold">+</button></div><div className="space-y-2">{customFields.map(f => (<div key={f.id} className="flex justify-between items-center p-3 bg-white border border-gray-200 rounded-xl"><span className="text-sm font-medium">{f.name}</span><button onClick={()=>deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'customFields',f.id))}><X className="w-4 h-4 text-gray-400 hover:text-red-500"/></button></div>))}</div></div>);
        }

        // --- FORMS ---
        function ClientForm({ user, db, client, onClose }) {
            const [name, setName] = useState(client?.name || ''); const [phone, setPhone] = useState(client?.phone || ''); const [email, setEmail] = useState(client?.email || ''); const [notes, setNotes] = useState(client?.notes || '');
            const [code, setCode] = useState(client?.code || Math.floor(1000 + Math.random() * 9000).toString());
            const handleSubmit = async (e) => { e.preventDefault(); if (!name || !user) return; const data = { name, phone, email, notes, code }; const collRef = collection(db, 'artifacts', appId, 'users', user.uid, 'clients'); try { if (client) await updateDoc(doc(collRef, client.id), data); else await addDoc(collRef, data); onClose(); } catch (err) { alert(err.message); } };
            return (<form onSubmit={handleSubmit} className="p-8 space-y-4"><h2 className="text-2xl font-bold text-gray-900 tracking-tight uppercase mb-2">{client ? 'Редактировать' : 'Новый клиент'}</h2><div className="bg-blue-50 p-4 rounded-xl text-center border border-blue-100"><Label>Код доступа клиента</Label><div className="text-3xl font-black text-blue-600">{code}</div></div><Input label="Имя / Компания *" required value={name} onChange={e=>setName(e.target.value)} /><Input label="Телефон" value={phone} onChange={e=>setPhone(e.target.value)} /><Input label="Email" value={email} onChange={e=>setEmail(e.target.value)} /><div><Label>Заметки</Label><textarea value={notes} onChange={e=>setNotes(e.target.value)} className="w-full border border-gray-200 rounded-xl p-2.5 outline-none min-h-[100px]"></textarea></div><PrimaryBtn className="w-full py-4 uppercase font-black text-xs tracking-widest hover:bg-black transition-all">Сохранить клиента</PrimaryBtn></form>);
        }
        function TransactionForm({ user, db, categories, accounts, deals, onClose, editingTx }) {
            const [type, setType] = useState(editingTx?.type || 'income'); const [status, setStatus] = useState(editingTx?.status || 'fact'); 
            const [amount, setAmount] = useState(editingTx?.amount || ''); const [categoryId, setCategoryId] = useState(editingTx?.categoryId || ''); const [accountId, setAccountId] = useState(editingTx?.accountId || ''); 
            const [dealId, setDealId] = useState(editingTx?.dealId || ''); const [description, setDescription] = useState(editingTx?.description || ''); const [date, setDate] = useState(editingTx?.date || new Date().toISOString().split('T')[0]);
            const filteredCats = categories.filter(c => c.type === type || !c.type);
            const handleSubmit = async (e) => { e.preventDefault(); if (!amount || !categoryId || !accountId || !user) return; const data = { type, status, amount: Number(amount), categoryId, accountId, dealId: dealId || null, description, date }; try { if(editingTx) await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', editingTx.id), data); else await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'transactions'), { ...data, createdAt: serverTimestamp() }); onClose(); } catch (err) {} };
            return (<form onSubmit={handleSubmit} className="p-8 space-y-6"><h2 className="text-2xl font-bold text-gray-900 tracking-tight uppercase mb-2">{editingTx ? 'Редактировать' : 'Новая операция'}</h2><div className="flex bg-slate-50 p-1.5 rounded-2xl"><button type="button" onClick={()=>setType('income')} className={`flex-1 py-2.5 text-xs font-black uppercase rounded-xl transition-all ${type==='income'?'bg-white shadow text-emerald-600':'text-slate-400'}`}>Доход</button><button type="button" onClick={()=>setType('expense')} className={`flex-1 py-2.5 text-xs font-black uppercase rounded-xl transition-all ${type==='expense'?'bg-white shadow text-red-600':'text-slate-400'}`}>Расход</button></div><div className="flex bg-slate-50 p-1.5 rounded-2xl"><button type="button" onClick={()=>setStatus('fact')} className={`flex-1 py-2.5 text-xs font-black uppercase tracking-widest rounded-xl transition-all ${status==='fact'?'bg-slate-900 text-white shadow':'text-slate-400'}`}>Факт</button><button type="button" onClick={()=>setStatus('plan')} className={`flex-1 py-2.5 text-xs font-black uppercase tracking-widest rounded-xl transition-all ${status==='plan'?'bg-white shadow text-blue-600':'text-slate-400'}`}>План</button></div><div className="grid grid-cols-2 gap-4"><Input label="Сумма (₽) *" type="number" required value={amount} onChange={e=>setAmount(e.target.value)} /><Input label="Дата" type="date" required value={date} onChange={e=>setDate(e.target.value)} /></div><div className="grid grid-cols-2 gap-4"><Select label="Счет *" value={accountId} onChange={e=>setAccountId(e.target.value)}><option value="">Выбрать счет</option>{accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</Select><Select label="Категория *" value={categoryId} onChange={e=>setCategoryId(e.target.value)}><option value="">Выбрать категорию</option>{filteredCats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</Select></div><Select label="Привязать к сделке" value={dealId} onChange={e=>setDealId(e.target.value)}><option value="">-- Нет --</option>{deals.map(d=><option key={d.id} value={d.id}>{d.title}</option>)}</Select><Input label="Описание" value={description} onChange={e=>setDescription(e.target.value)} /><button type="submit" className={`w-full py-5 text-white rounded-3xl font-black uppercase tracking-widest text-xs transition-all shadow-lg hover:shadow-xl ${type==='income'?'bg-emerald-600 hover:bg-emerald-700':'bg-red-600 hover:bg-red-700'}`}>{editingTx ? 'Сохранить изменения' : 'Записать'}</button></form>);
        }

        // --- 5. TABS & DEAL CARD ---
        function DealCommentsTab({ user, db, deal }) {
            const [text, setText] = useState(''); const [comments, setComments] = useState([]);
            useEffect(() => { const q = collection(db, 'artifacts', appId, 'users', user.uid, 'deals', deal.id, 'comments'); return onSnapshot(q, snap => setComments(snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.createdAt?.toDate() || 0) - (b.createdAt?.toDate() || 0)))); }, [deal.id]);
            const send = async () => { if (!text.trim()) return; await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'deals', deal.id, 'comments'), { text, author: user.email || 'Менеджер', createdAt: serverTimestamp() }); setText(''); };
            return (<div className="flex flex-col h-full min-h-[400px]"><div className="flex-1 space-y-4 overflow-y-auto no-scrollbar pb-24">{comments.length === 0 ? <p className="text-center text-slate-300 py-10 uppercase text-[10px] font-bold">История пуста</p> : comments.map(c => (<div key={c.id} className="flex gap-3 bg-slate-50 p-3 rounded-2xl"><div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shrink-0"><User size={14}/></div><div className="flex-1"><div className="text-[10px] font-bold text-blue-600 mb-1 uppercase">{c.author}</div><div className="text-sm">{c.text}</div></div></div>))}</div><div className="absolute bottom-0 left-0 right-0 p-6 bg-white border-t flex gap-2"><input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} className="flex-1 bg-slate-100 p-3 rounded-xl outline-none text-sm" placeholder="Написать..." /><button onClick={send} className="bg-blue-600 text-white p-3 rounded-xl"><Send size={18}/></button></div></div>);
        }

        function DealTasksTab({ user, db, deal, tasks, toggleTask }) {
            const [title, setTitle] = useState('');
            const handleAdd = async (e) => { e.preventDefault(); if(!title.trim()) return; await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'tasks'), { title: title.trim(), dealId: deal.id, isCompleted: false, createdAt: serverTimestamp() }); setTitle(''); };
            return (<div className="space-y-6"><form onSubmit={handleAdd} className="flex gap-2 items-center"><Input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Что нужно сделать?" className="bg-slate-50 border-none" /><button type="submit" className="bg-blue-600 text-white w-12 h-[48px] rounded-xl font-bold shadow-lg transition-all hover:bg-blue-700 shrink-0">+</button></form><div className="space-y-2">{tasks.map(t=>(<div key={t.id} className="flex items-center gap-3 p-4 bg-white border rounded-xl hover:shadow-md transition-all"><button onClick={()=>toggleTask(t)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${t.isCompleted?'bg-blue-500 border-blue-500':'border-slate-200 hover:border-blue-400'}`}>{t.isCompleted && <Check size={12} className="text-white"/>}</button><div className={`flex-1 text-sm font-medium ${t.isCompleted ? 'line-through text-slate-300':'text-slate-800'}`}>{t.title}</div><button onClick={()=>deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'tasks',t.id))} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Trash2 size={16}/></button></div>))}</div></div>);
        }

        function DealFinancesTab({ user, db, deal, transactions, accounts, deleteTx }) {
            const [amount, setAmt] = useState(''); const [accountId, setAcc] = useState('');
            const projectTx = transactions.filter(t => t.dealId === deal.id);
            const profit = projectTx.filter(t=>t.type==='income'&&t.status==='fact').reduce((s,t)=>s+Number(t.amount), 0) - projectTx.filter(t=>t.type==='expense'&&t.status==='fact').reduce((s,t)=>s+Number(t.amount), 0);
            const handleAdd = async (type) => { if(!amount || !accountId) return; await addDoc(collection(db,'artifacts',appId,'users',user.uid,'transactions'), { type, amount: Number(amount), accountId, dealId: deal.id, date: new Date().toISOString().split('T')[0], status: 'fact', createdAt: serverTimestamp() }); setAmt(''); };
            return (<div className="space-y-6"><div className="grid grid-cols-2 gap-4"><div className="bg-slate-50 p-4 rounded-2xl border"><Label>Бюджет проекта</Label><div className="text-xl font-black">{Number(deal.value).toLocaleString()} ₽</div></div><div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100"><Label>Прибыль (Факт)</Label><div className="text-xl font-black text-emerald-700">{profit.toLocaleString()} ₽</div></div></div><div className="p-4 bg-slate-50 rounded-2xl space-y-3"><Input placeholder="Сумма" type="number" value={amount} onChange={e=>setAmt(e.target.value)} /><Select value={accountId} onChange={e=>setAcc(e.target.value)}><option value="">Выберите счет...</option>{accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</Select><div className="grid grid-cols-2 gap-2"><button onClick={()=>handleAdd('income')} className="bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs uppercase">Доход</button><button onClick={()=>handleAdd('expense')} className="bg-red-600 text-white py-3 rounded-xl font-bold text-xs uppercase">Расход</button></div></div><div className="space-y-2">{projectTx.map(tx => (<div key={tx.id} className="flex justify-between items-center p-3 border-b"><div><div className="text-xs font-bold">{accounts.find(a=>a.id===tx.accountId)?.name || 'Счет'}</div><div className="text-[10px] text-slate-400">{tx.date}</div></div><div className="flex items-center gap-3"><span className={`font-black text-sm ${tx.type==='income'?'text-emerald-500':'text-rose-500'}`}>{Number(tx.amount).toLocaleString()} ₽</span><button onClick={()=>deleteTx(tx.id)} className="text-slate-200 hover:text-red-500 transition-colors"><Trash2 size={14}/></button></div></div>))}</div></div>);
        }

        // --- 6. CORE VIEWS ---
        function DealManager({ user, db, deal, stages, clients, tasks, transactions, categories, accounts, customFields, onClose, toggleTask, deleteDeal, onAddClient, deleteTx }) {
            const [activeTab, setActiveTab] = useState('comments');
            if (!deal) return <DealForm user={user} db={db} stages={stages} clients={clients} onClose={onClose} />;
            
            const client = clients.find(c => c.id === deal.clientId);
            const clientName = client ? client.name : "Нет данных";
            const clientPhone = client ? client.phone : "---";
            const stageIndex = stages.findIndex(s => s.id === deal.stageId);

            return (
                <div className="flex h-[90vh] bg-white flex-col md:flex-row overflow-hidden relative selection:bg-blue-100">
                    <button onClick={onClose} className="absolute top-4 right-4 z-50 p-2 hover:bg-gray-100 rounded-full transition-colors"><X className="w-5 h-5 text-gray-400" /></button>
                    <div className="w-full md:w-[45%] border-r border-slate-100 p-10 flex flex-col space-y-8 overflow-y-auto no-scrollbar bg-slate-50/20">
                        <div><h1 className="text-3xl font-black text-slate-900 leading-tight mb-2">{deal.title}</h1><div className="flex gap-1.5 mb-6">{stages.map((s, i) => (<div key={s.id} onClick={() => updateDoc(doc(db,'artifacts',appId,'users',user.uid,'deals',deal.id), {stageId:s.id})} className={`step-segment ${i < stageIndex ? 'completed' : i === stageIndex ? 'active' : ''}`} />))}</div></div>
                        <div><Label>Бюджет</Label><input type="number" defaultValue={deal.value} onBlur={(e) => updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'deals', deal.id), {value:Number(e.target.value)})} className="text-3xl font-black bg-transparent outline-none w-full" /></div>
                        <div className="pt-4 border-t border-slate-100"><Label>Контакты</Label>{client ? <div className="flex items-center gap-4 mt-2 p-4 bg-white border rounded-2xl shadow-sm hover:border-blue-200 transition-all"><div className="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 font-black uppercase shadow-inner">{clientName[0]}</div><div className="flex-1"><div className="font-black text-sm text-slate-900">{clientName}</div><div className="text-xs font-bold text-blue-500 opacity-80">{clientPhone}</div></div><select className="bg-transparent text-[10px] uppercase font-bold text-slate-400 outline-none text-right cursor-pointer hover:text-blue-600" value={client.id} onChange={(e) => updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'deals', deal.id), { clientId: e.target.value })}><option value={client.id}>Сменить</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div> : <div onClick={onAddClient} className="mt-2 p-4 border-2 border-dashed rounded-2xl text-center text-slate-400 cursor-pointer hover:bg-white transition-all text-xs font-bold flex items-center justify-center gap-2"><Plus size={16}/> Привязать клиента</div>}</div>
                        <div className="space-y-6 pt-2">{customFields && customFields.map(f => (<div key={f.id} className="group"><label className="text-[10px] font-black uppercase tracking-widest text-slate-400 group-hover:text-blue-600 transition-colors mb-1 block">{f.name}</label><input defaultValue={deal.customData?.[f.id] || ''} onBlur={(e) => updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'deals', deal.id), { [`customData.${f.id}`]: e.target.value })} className="w-full bg-transparent border-b border-transparent hover:border-slate-200 focus:border-blue-500 outline-none py-1 text-sm font-semibold text-slate-700" placeholder="Не заполнено" /></div>))}</div>
                        <div className="pt-4"><button onClick={()=>deleteDeal(deal.id)} className="text-red-400 text-[10px] font-black uppercase hover:text-red-600 flex items-center gap-1"><Trash2 size={12}/> Удалить проект</button></div>
                    </div>
                    <div className="flex-1 flex flex-col bg-white relative">
                        <div className="flex border-b border-slate-100 px-10 shrink-0"><button onClick={() => setActiveTab('comments')} className={`py-6 text-[10px] font-black uppercase mr-8 border-b-2 transition-all ${activeTab==='comments'?'border-blue-600 text-blue-600':'border-transparent text-slate-300'}`}>История</button><button onClick={() => setActiveTab('tasks')} className={`py-6 text-[10px] font-black uppercase mr-8 border-b-2 transition-all ${activeTab==='tasks'?'border-blue-600 text-blue-600':'border-transparent text-slate-300'}`}>Задачи</button><button onClick={() => setActiveTab('finances')} className={`py-6 text-[10px] font-black uppercase border-b-2 transition-all ${activeTab==='finances'?'border-blue-600 text-blue-600':'border-transparent text-slate-300'}`}>Финансы</button></div>
                        <div className="flex-1 overflow-y-auto p-10 relative">
                            {activeTab === 'comments' && <DealCommentsTab user={user} db={db} deal={deal} />}
                            {activeTab === 'tasks' && <DealTasksTab user={user} db={db} deal={deal} tasks={tasks.filter(t=>t.dealId===deal.id)} toggleTask={toggleTask} />}
                            {activeTab === 'finances' && <DealFinancesTab user={user} db={db} deal={deal} transactions={transactions} categories={categories} accounts={accounts} deleteTx={deleteTx} />}
                        </div>
                    </div>
                </div>
            );
        }

                <div className="kanban-scroll flex h-full space-x-6 overflow-x-auto pb-6 items-start">
                    {stages.map(stage => {
                        const stageDeals = deals.filter(d => d.stageId === stage.id);
                        const stageTotal = stageDeals.reduce((sum, d) => sum + Number(d.value || 0), 0);
                        return (
                            <div key={stage.id} className="flex-shrink-0 w-80 flex flex-col max-h-full bg-slate-200/20 rounded-[32px] p-2 border border-slate-100 shadow-inner">
                                <div className="flex justify-between items-center mb-3 px-4 pt-3 shrink-0"><h3 className="font-bold text-slate-900 text-[10px] uppercase tracking-widest opacity-40">{stage.name}</h3><span className="text-slate-400 font-black text-[10px] bg-white px-2 py-0.5 rounded-full">{stageTotal.toLocaleString()} ₽</span></div>

                                        <div key={deal.id} onClick={() => { setEditingDeal(deal); setIsDealModalOpen(true); }} className="bg-white p-6 rounded-[28px] shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer group ring-1 ring-black/[0.03] border border-transparent hover:border-blue-100"><h4 className="font-black text-slate-800 leading-tight mb-2 text-sm">{deal.title}</h4><div className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-3 opacity-60">{getClientName(deal.clientId)}</div><div className="font-black text-slate-900 text-xs">{Number(deal.value||0).toLocaleString()} ₽</div></div>
                                    ))}
                                    <button onClick={() => { setEditingDeal(null); setIsDealModalOpen(true); }} className="w-full py-5 rounded-[24px] border-2 border-dashed border-slate-200 text-slate-300 hover:border-blue-400 hover:text-blue-500 transition-all text-[10px] font-black uppercase">Добавить проект</button>
                                </div>
                            </div>

                    })}

        function ClientsView({ clients, setEditingClient, setIsClientModalOpen }) {
            return (
                <div className="glass-panel rounded-[32px] shadow-sm border border-white/50 overflow-hidden flex flex-col h-full animate-in fade-in">
                    <div className="p-6 border-b border-gray-100 bg-white/50 backdrop-blur-sm flex justify-between items-center"><h2 className="text-xl font-black text-slate-900 tracking-tighter uppercase">База клиентов</h2><PrimaryBtn onClick={()=>{setEditingClient(null); setIsClientModalOpen(true);}} className="px-6 py-3 text-xs bg-blue-600 hover:bg-blue-700 shadow-blue-200"><Plus size={16}/> Добавить</PrimaryBtn></div>
                    <div className="flex-1 overflow-auto"><table className="w-full text-left"><thead className="bg-gray-50/50 text-gray-400 text-[10px] uppercase tracking-widest font-black border-b sticky top-0"><tr><th className="p-6">Клиент</th><th className="p-6">Телефон</th><th className="p-6">Код Доступа</th><th className="p-6 text-right"></th></tr></thead><tbody className="divide-y divide-gray-100 bg-white/40">{clients.map(c => (<tr key={c.id} className="hover:bg-white/80 transition-colors group cursor-pointer" onClick={() => { setEditingClient(c); setIsClientModalOpen(true); }}><td className="p-6 font-bold text-gray-900">{c.name}</td><td className="p-6 text-sm font-medium">{c.phone}</td><td className="p-6 text-xs font-black text-blue-600">{c.code}</td><td className="p-6 text-right group-hover:text-blue-600 uppercase font-black text-[10px]">Ред.</td></tr>))}</tbody></table>{clients.length === 0 && <div className="p-20 text-center text-gray-300 font-black uppercase tracking-widest text-[10px]">Список пуст</div>}</div>
                </div>
            );
        }

        function TasksView({ tasks, toggleTask, deleteDoc, user, appId, db }) {
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const handleAddTask = async (e) => {
                e.preventDefault(); if (!newTaskTitle.trim()) return;
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'tasks'), { title: newTaskTitle, isCompleted: false, createdAt: serverTimestamp(), dealId: null });
                setNewTaskTitle('');
            };
            return (
                <div className="glass-panel rounded-[32px] shadow-sm border border-white/50 overflow-hidden flex flex-col h-full animate-in fade-in p-6">
                    <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black text-slate-900 tracking-tighter uppercase">Все задачи</h2></div>
                    <form onSubmit={handleAddTask} className="flex gap-2 mb-6"><input value={newTaskTitle} onChange={e=>setNewTaskTitle(e.target.value)} className="flex-1 bg-white p-4 rounded-2xl border border-gray-200 outline-none" placeholder="Новая задача..." /><button className="bg-blue-600 text-white w-14 rounded-2xl flex items-center justify-center"><Plus/></button></form>
                    <div className="flex-1 overflow-y-auto space-y-2">
                        {tasks.map(t => (
                            <div key={t.id} className="flex items-center gap-4 p-4 bg-white border border-gray-100 rounded-2xl hover:shadow-md transition-all group">
                                <button onClick={()=>toggleTask(t)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${t.isCompleted?'bg-blue-500 border-blue-500':'border-slate-300'}`}>{t.isCompleted && <Check size={14} className="text-white"/>}</button>
                                <div className={`flex-1 font-medium ${t.isCompleted?'line-through text-slate-400':'text-slate-800'}`}>{t.title}</div>
                                <button onClick={()=>deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'tasks',t.id))} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Trash2 size={18}/></button>
                            </div>
                        ))}
                        {tasks.length === 0 && <div className="text-center py-20 text-slate-300 font-bold uppercase text-xs">Нет задач</div>}
                    </div>
                </div>
            );
        }

        function FinancesView({ totalBalance, catBalances, transactions, categories, deleteTx, aiAnalysis, aiLoading, handleAiAnalysis, accounts, setEditingTx, setIsTxModalOpen }) {
            return (
                <div className="max-w-5xl mx-auto space-y-6 animate-in fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-slate-900 text-white rounded-[40px] p-10 shadow-xl relative overflow-hidden flex flex-col justify-center min-h-[180px]"><Wallet className="absolute right-[-20px] bottom-[-20px] w-40 h-40 opacity-10" /><div className="relative z-10"><div className="text-[10px] uppercase font-black text-slate-500 tracking-widest mb-1">Ваш баланс (Факт)</div><div className="text-4xl font-black tracking-tighter">{totalBalance.toLocaleString('ru-RU')} ₽</div></div><button onClick={handleAiAnalysis} disabled={aiLoading} className="mt-4 bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition-all flex items-center w-fit gap-2">{aiLoading ? <Loader2 size={12} className="animate-spin"/> : <Sparkles size={12}/>} AI Анализ вывода</button></div>
                        {aiAnalysis && <div className="md:col-span-2 bg-indigo-600 text-white rounded-[40px] p-8 shadow-xl relative overflow-hidden animate-in slide-in-from-right duration-500"><div className="relative z-10"><h3 className="font-black uppercase tracking-widest text-indigo-200 text-xs mb-2">Совет нейросети</h3><p className="font-medium text-sm leading-relaxed">{aiAnalysis}</p></div><Sparkles className="absolute right-[-20px] top-[-20px] w-40 h-40 opacity-10 rotate-12" /></div>}
                        {!aiAnalysis && <div className="md:col-span-2 bg-white rounded-[40px] shadow-sm ring-1 ring-black/5 p-10 flex flex-col"><h3 className="font-black text-xs uppercase tracking-widest text-gray-400 mb-6">Счета и кошельки</h3><div className="flex gap-4 overflow-x-auto pb-2 flex-1 items-center no-scrollbar">{Object.values(catBalances).map((cat, idx) => (<div key={idx} className="bg-slate-50 rounded-3xl p-5 min-w-[180px] border border-slate-100 transition-transform hover:scale-[1.02] flex-shrink-0"><div className="text-[10px] font-bold text-gray-400 uppercase truncate mb-1">{cat.name}</div><div className={`font-black text-xl ${cat.balance >= 0 ? 'text-emerald-600' : 'text-rose-500'}`}>{cat.balance.toLocaleString('ru-RU')} ₽</div></div>))}</div></div>}
                    </div>
                    <div className="glass-panel rounded-[32px] overflow-hidden shadow-sm"><table className="w-full text-left"><thead className="bg-gray-50/50 border-b font-black"><tr className="text-gray-400 text-[10px] uppercase tracking-widest font-black"><th className="p-6">Дата</th><th className="p-6">Статус</th><th className="p-6">Описание</th><th className="p-6 text-right">Сумма</th></tr></thead><tbody className="divide-y divide-gray-100 bg-white/40">{transactions.map(tx => { const accName = accounts.find(a => a.id === tx.accountId)?.name || 'Счет удален'; return (<tr key={tx.id} className={`group transition-colors hover:bg-white ${tx.status === 'plan' ? 'opacity-50' : ''}`}><td className="p-6 text-xs font-bold text-gray-400 uppercase">{tx.date}</td><td className="p-6"><span className={`text-[9px] font-black uppercase px-2 py-1 rounded ${tx.status==='fact'?'bg-slate-900 text-white':'bg-slate-100 text-slate-500'}`}>{tx.status==='fact'?'Проведено':'План'}</span></td><td className="p-6"><div className="font-bold text-gray-900 text-sm">{tx.description || 'Операция'}</div><div className="text-[10px] uppercase font-black text-gray-400 mt-1">{categories.find(c=>c.id===tx.categoryId)?.name || 'Общий'} • {accName}</div></td><td className="p-6 text-right flex items-center justify-end gap-2"><div className={`font-black text-sm ${tx.type==='income'?'text-emerald-600':'text-gray-900'}`}>{tx.type==='income'?'+':'-'}{Number(tx.amount).toLocaleString()} ₽</div><button onClick={()=>{setEditingTx(tx); setIsTxModalOpen(true);}} className="text-slate-400 hover:text-blue-500"><Pencil size={14}/></button><button onClick={()=>deleteTx(tx.id)} className="text-slate-400 hover:text-red-500"><Trash2 size={14}/></button></td></tr>)})}</tbody></table></div>
                </div>
            );
        }

        // --- CALCULATOR AS LINK (LITE) ---
        function ProjectCalculator() {
            return (
                <div className="flex flex-col items-center justify-center h-full p-10 animate-in fade-in">
                    <div className="w-24 h-24 bg-blue-100 text-blue-600 rounded-3xl flex items-center justify-center mb-6 shadow-inner"><Calculator size={48}/></div>
                    <h2 className="text-3xl font-black text-slate-900 mb-2">Калькулятор Зеркал</h2>
                    <p className="text-slate-500 mb-8 text-center max-w-md">Расширенный расчет стоимости, генерация КП и аналитика доступны в отдельном модуле.</p>
                    <a href="#" className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-xl hover:bg-blue-700 transition-transform hover:scale-105 flex items-center gap-2">Перейти в калькулятор <ExternalLink size={20}/></a>
                </div>
            );
        }

        function SettingsView({ user, appId, db, accounts, categories, stages, customFields, subTier, setIsSubModalOpen, managers }) {
            return (
                <div className="max-w-3xl mx-auto space-y-6 animate-in fade-in duration-500 pb-20">
                    <SettingsCard title="Код Компании" icon={<Hash size={18}/>}><CompanyIdCard user={user} db={db} appId={appId} /></SettingsCard>
                    <SettingsCard title="Команда" icon={<Users2 size={18}/>}><TeamManager user={user} db={db} managers={managers} /></SettingsCard>
                    <SettingsCard title="Счета" icon={<CreditCard size={18}/>}><Manager user={user} db={db} items={accounts} col="accounts" placeholder="Название счета" /></SettingsCard>
                    <SettingsCard title="Категории" icon={<Tag size={18}/>}><CategoryManager user={user} db={db} categories={categories}/></SettingsCard>
                    <SettingsCard title="Поля сделки" icon={<Sliders size={18}/>}><CustomFieldManager user={user} db={db} customFields={customFields}/></SettingsCard>
                    <SettingsCard title="Этапы сделок" icon={<LayoutDashboard size={18}/>}><Manager user={user} db={db} items={stages} col="stages" placeholder="Новый статус" /></SettingsCard>
                </div>
            );
        }

        function AuthScreen({ auth, db, appId, setClientViewData }) {
            const [isLogin, setIsLogin] = useState(true);
            const [mode, setMode] = useState('staff');
            const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [clientPhone, setClientPhone] = useState(''); const [clientCode, setClientCode] = useState('');
            const [companyShortCode, setCompanyShortCode] = useState(''); const [loading, setLoading] = useState(false);

            const handleStaffAuth = async (e) => { e.preventDefault(); setLoading(true); try { if (isLogin) await signInWithEmailAndPassword(auth, email, password); else await createUserWithEmailAndPassword(auth, email, password); } catch (err) { alert(err.message); } setLoading(false); };
            const handleClientAuth = async (e) => { 
                e.preventDefault(); setLoading(true); 
                try { 
                    await signInAnonymously(auth); 
                    const codeDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'companies', companyShortCode.trim())); 
                    if (!codeDoc.exists()) { alert("Код компании не найден"); setLoading(false); return; } 
                    const adminId = codeDoc.data().ownerId; 
                    const q = query(collection(db, 'artifacts', appId, 'users', adminId, 'clients'), where('phone', '==', clientPhone.trim()), where('code', '==', clientCode.trim())); 
                    const snap = await getDocs(q); 
                    if (snap.empty) { alert("Неверный телефон или код доступа"); setLoading(false); return; } 
                    const dealsSnap = await getDocs(query(collection(db, 'artifacts', appId, 'users', adminId, 'deals'), where('clientId', '==', snap.docs[0].id))); 
                    if (!dealsSnap.empty) { 
                        const deal = dealsSnap.docs[0].data(); 
                        const stagesSnap = await getDocs(collection(db, 'artifacts', appId, 'users', adminId, 'stages')); 
                        setClientViewData({deal, stages: stagesSnap.docs.map(d=>d.data()).sort((a,b)=>a.order-b.order)}); 
                    } else { alert("Заказов нет"); } 
                } catch(e) { alert("Ошибка входа: " + e.message); } 
                setLoading(false); 
            };

            return (
                <div className="flex h-screen items-center justify-center bg-[#F5F5F7] p-4">
                    <div className="w-full max-w-md bg-white p-10 rounded-[40px] shadow-2xl ring-1 ring-black/5">
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-black rounded-2xl flex items-center justify-center text-white shadow-lg"><Briefcase size={32}/></div></div>
                        <div className="flex bg-slate-100 p-1 rounded-xl mb-8">
                            <button onClick={()=>setMode('staff')} className={`flex-1 py-3 text-xs font-black uppercase rounded-lg transition-all ${mode==='staff'?'bg-white shadow-sm text-black':'text-slate-400'}`}>Сотрудник</button>
                            <button onClick={()=>setMode('client')} className={`flex-1 py-3 text-xs font-black uppercase rounded-lg transition-all ${mode==='client'?'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>Клиент</button>
                        </div>
                        {mode === 'staff' ? (
                            <form onSubmit={handleStaffAuth} className="space-y-4"><Input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required /><Input placeholder="Пароль" type="password" value={password} onChange={e=>setPassword(e.target.value)} required /><button disabled={loading} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition-all shadow-lg uppercase tracking-widest text-xs">Войти</button><div className="text-center mt-2"><button type="button" onClick={()=>setIsLogin(!isLogin)} className="text-xs text-slate-400 font-bold hover:text-black uppercase tracking-widest">{isLogin ? 'Регистрация' : 'Вход'}</button></div></form>
                        ) : (
                            <form onSubmit={handleClientAuth} className="space-y-4"><Input label="Код Компании (6 цифр)" value={companyShortCode} onChange={e=>setCompanyShortCode(e.target.value)} required /><Input label="Ваш телефон" value={clientPhone} onChange={e=>setClientPhone(e.target.value)} required /><Input label="Код доступа" value={clientCode} onChange={e=>setClientCode(e.target.value)} required /><button disabled={loading} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold uppercase text-xs">Войти</button></form>
                        )}
                        <div className="mt-8 pt-8 border-t border-slate-100 grid grid-cols-2 gap-3"><button onClick={async()=>{try{await signInAnonymously(auth);}catch(e){alert(e.message);}}} className="py-3 bg-slate-50 text-slate-600 rounded-xl font-bold text-[10px] uppercase hover:bg-slate-100 transition-colors tracking-widest">Демо Сотрудник</button><button onClick={() => setClientViewData({ deal: { title: 'Демо Заказ', value: 12000, stageId: 'w' }, stages: [{ id: 'w', name: 'В работе' }] })} className="py-3 bg-blue-50 text-blue-600 rounded-xl font-bold text-[10px] uppercase hover:bg-blue-100 transition-colors tracking-widest">Демо Клиент</button></div>
                    </div>
                </div>
            );
        }

        // --- 7. MAIN APP ---

        function App() {
            const [user, setUser] = useState(null);
            const [loadingAuth, setLoadingAuth] = useState(true);
            const [activeTab, setActiveTab] = useState('kanban');
            const [clientViewData, setClientViewData] = useState(null);
            const [toast, setToast] = useState(null);
            
            const [stages, setStages] = useState([]); const [deals, setDeals] = useState([]); const [tasks, setTasks] = useState([]); 
            const [clients, setClients] = useState([]); const [categories, setCategories] = useState([]); const [accounts, setAccounts] = useState([]); 
            const [transactions, setTransactions] = useState([]); const [customFields, setCustomFields] = useState([]); const [managers, setManagers] = useState([]);

            const [isDealModalOpen, setIsDealModalOpen] = useState(false); const [editingDealId, setEditingDealId] = useState(null); const [isClientModalOpen, setIsClientModalOpen] = useState(false); const [editingClient, setEditingClient] = useState(null); const [isTxModalOpen, setIsTxModalOpen] = useState(false); const [editingTx, setEditingTx] = useState(null); const [isHelpModalOpen, setIsHelpModalOpen] = useState(false); const [isSubModalOpen, setIsSubModalOpen] = useState(false);
            const [voiceStatus, setVoiceStatus] = useState(''); const [isListening, setIsListening] = useState(false); const recognitionRef = useRef(null);
            const [aiAnalysis, setAiAnalysis] = useState(null); const [aiLoading, setAiLoading] = useState(false);

            useEffect(() => { const unsub = onAuthStateChanged(auth, u => { setUser(u); setLoadingAuth(false); }); return () => unsub(); }, []);
            useEffect(() => {
                if (!user || clientViewData) return;
                const getPath = (c) => collection(db, 'artifacts', appId, 'users', user.uid, c);
                const unsubArr = [
                    onSnapshot(getPath('stages'), s => { let data = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>a.order-b.order); if (!data.length && !s.metadata.hasPendingWrites) [{name:'Замер',order:1},{name:'В работе',order:2},{name:'Монтаж',order:3},{name:'Завершено',order:4}].forEach(st => addDoc(getPath('stages'), st)); else setStages(data); }),
                    onSnapshot(getPath('deals'), s => setDeals(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('tasks'), s => setTasks(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('clients'), s => setClients(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('categories'), s => setCategories(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('transactions'), s => setTransactions(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('customFields'), s => setCustomFields(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('managers'), s => setManagers(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    onSnapshot(getPath('accounts'), s => { const data = s.docs.map(d => ({id:d.id, ...d.data()})); if(!data.length && !s.metadata.hasPendingWrites) addDoc(getPath('accounts'), {name: 'Основной счет'}); else setAccounts(data); })
                ];
                return () => unsubArr.forEach(un => un());
            }, [user, clientViewData]);

            const deleteDeal = async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'deals', id)); setIsDealModalOpen(false); };
            const deleteTx = async (id) => { if(confirm("Удалить операцию?")) await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', id)); };
            const deleteDocRef = async (docRef) => { await deleteDoc(docRef); };
            const toggleTask = async (t) => { await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', t.id), { isCompleted: !t.isCompleted }); };
            const totalBalance = useMemo(() => transactions.reduce((s, t) => s + (t.status === 'fact' ? (t.type === 'income' ? Number(t.amount) : -Number(t.amount)) : 0), 0), [transactions]);
            const { catBalances } = useMemo(() => { let cB = {}; accounts.forEach(a => cB[a.id] = { name: a.name, balance: 0 }); transactions.forEach(tx => { if (tx.status === 'fact' && tx.accountId && cB[tx.accountId]) cB[tx.accountId].balance += (tx.type === 'income' ? Number(tx.amount) : -Number(tx.amount)); }); return { catBalances: cB }; }, [accounts, transactions]);

            const startListening = () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return alert("Браузер не поддерживает голосовой ввод");
                const r = new SR(); r.lang = 'ru-RU'; recognitionRef.current = r;
                r.onstart = () => { setIsListening(true); setVoiceStatus('Слушаю...'); };
                r.onresult = async (ev) => {
                    const txt = ev.results[0][0].transcript; setVoiceStatus(`Распознал: ${txt}`);
                    const cmd = localCommandParser(txt);
                    if (cmd && cmd.action === 'create_task') {
                        await addDoc(collection(db,'artifacts',appId,'users',user.uid,'tasks'), {...cmd.data, isCompleted: false, createdAt: serverTimestamp()});
                        setToast(`Задача создана: ${cmd.data.title}`);
                        setTimeout(()=>setToast(null), 3000);
                    }
                    setIsListening(false); setTimeout(()=>setVoiceStatus(''), 2500);
                };
                r.onerror = () => setIsListening(false);
                r.start();
            };

            const handleAiAnalysis = async () => {
                setAiLoading(true);
                const plannedExp = transactions.filter(t => t.status === 'plan' && t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
                const res = await callGemini(`Баланс: ${totalBalance} р. Плановые расходы: ${plannedExp} р. Сколько безопасно вывести собственнику? Дай краткий ответ.`);
                setAiAnalysis(res || `Алгоритм: С учетом остатка ${totalBalance}₽ и плановых трат ${plannedExp}₽, рекомендуемый лимит вывода: ${Math.max(0, (totalBalance - plannedExp) * 0.8).toLocaleString()}₽.`);
                setAiLoading(false);
            };

            const activeDeal = deals.find(d => d.id === editingDealId);

            if (loadingAuth) return <div className="h-screen flex items-center justify-center bg-gray-50"><Loader2 className="animate-spin text-blue-600" size={48}/></div>;
            
            if (clientViewData) {
                 const { deal, stages } = clientViewData;
                 const currentStageIdx = stages.findIndex(s=>s.id === deal.stageId);
                 return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-md bg-white rounded-[32px] p-8 shadow-xl animate-in zoom-in duration-300">
                            <div className="flex justify-between items-center mb-6"><h1 className="text-2xl font-black">Мой заказ</h1><button onClick={()=>{setClientViewData(null); signOut(auth);}} className="text-red-500 font-bold uppercase text-[10px]">Выход</button></div>
                            <h2 className="text-xl font-bold mb-6 text-slate-800">{deal.title}</h2>
                            <div className="space-y-6 mb-8 relative pl-6 border-l-2 border-slate-100 ml-3">
                                {stages.map((s, i) => (
                                    <div key={i} className="flex items-center gap-4 relative">
                                        <div className={`absolute -left-[29px] w-6 h-6 rounded-full border-4 border-white shadow-sm flex items-center justify-center ${i <= currentStageIdx ? 'bg-blue-600 border-blue-600' : 'bg-white border-slate-300'}`}>{i <= currentStageIdx && <Check size={10} className="text-white"/>}</div>
                                        <div className={`text-sm font-medium ${i <= currentStageIdx ? 'text-slate-900 font-bold' : 'text-slate-300'}`}>{s.name}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="bg-slate-900 text-white p-6 rounded-2xl text-center"><div className="text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-widest">К оплате</div><div className="text-3xl font-black tracking-tight">{Number(deal.value).toLocaleString()} ₽</div></div>
                        </div>
                    </div>
                 );
            }

            if (!user) return <AuthScreen auth={auth} db={db} appId={appId} setClientViewData={setClientViewData} />;

            return (
                <div className="flex h-screen overflow-hidden relative selection:bg-blue-100">
                    <aside className="group/aside w-20 hover:w-64 sidebar-transition glass flex flex-col shrink-0 z-50 border-r border-slate-200/50 overflow-hidden">
                        <div className="h-20 flex items-center justify-center md:justify-start md:px-8 border-b border-slate-100"><div className="bg-slate-900 p-2 rounded-2xl text-white shadow-lg shrink-0"><Briefcase size={24}/></div><span className="ml-3 font-black text-2xl tracking-tighter uppercase opacity-0 group-hover/aside:opacity-100 transition-opacity duration-300 whitespace-nowrap">ProCRM</span></div>
                        <nav className="flex-1 mt-10 px-4 space-y-1">
                            <NavItem icon={<LayoutDashboard size={22}/>} label="Проекты" active={activeTab === 'kanban'} onClick={()=>setActiveTab('kanban')} />
                            <NavItem icon={<Wallet size={22}/>} label="Финансы" active={activeTab === 'finances'} onClick={()=>setActiveTab('finances')} />
                            <NavItem icon={<Calculator size={22}/>} label="Калькулятор" active={activeTab === 'calculator'} onClick={()=>setActiveTab('calculator')} />
                            <NavItem icon={<Users size={22}/>} label="Клиенты" active={activeTab === 'clients'} onClick={()=>setActiveTab('clients')} badge={clients.length} />
                            <NavItem icon={<ListTodo size={22}/>} label="Задачи" active={activeTab === 'tasks'} onClick={()=>setActiveTab('tasks')} badge={tasks.filter(t=>!t.isCompleted).length} />
                            <NavItem icon={<Settings size={22}/>} label="Система" active={activeTab === 'settings'} onClick={()=>setActiveTab('settings')} />
                        </nav>
                        <div className="p-4 border-t border-slate-100 text-center shrink-0"><button onClick={()=>signOut(auth)} className="text-slate-400 hover:text-red-500 transition-colors font-black text-[10px] flex items-center justify-center gap-1 w-full py-4 hover:bg-red-50 rounded-2xl uppercase tracking-widest"><LogOut size={16}/> <span className="hidden group-hover/aside:inline ml-2">Выход</span></button></div>
                    </aside>

                    <div className="flex-1 flex flex-col min-w-0 bg-[#F5F5F7]">
                        <header className="h-20 flex items-center justify-between px-10 shrink-0 bg-white/50 backdrop-blur-md z-10 border-b">
                            <h1 className="text-2xl font-black text-slate-900 tracking-tight uppercase truncate">{TAB_NAMES[activeTab]}</h1>
                            <div className="flex gap-4">
                                {activeTab === 'kanban' && <PrimaryBtn onClick={()=>{setEditingDealId(null); setIsDealModalOpen(true);}}><Plus size={18}/> Проект</PrimaryBtn>}
                                {activeTab === 'finances' && <PrimaryBtn onClick={()=>{setEditingTx(null); setIsTxModalOpen(true);}} className="bg-emerald-600 hover:bg-emerald-700 shadow-emerald-100"><Plus size={18}/> Операция</PrimaryBtn>}
                                {activeTab === 'clients' && <PrimaryBtn onClick={()=>{setEditingClient(null); setIsClientModalOpen(true);}} className="bg-blue-600 hover:bg-blue-700 shadow-blue-100"><Plus size={18}/> Клиент</PrimaryBtn>}
                                <button onClick={()=>setIsHelpModalOpen(true)} className="p-2.5 bg-white border rounded-xl text-slate-400 hover:text-slate-600 transition-all shadow-sm"><HelpCircle size={20}/></button>
                            </div>
                        </header>
                        <main className="flex-1 overflow-auto p-10 pt-4 relative no-scrollbar">
                            {activeTab === 'kanban' && <KanbanView stages={stages} deals={deals} clients={clients} setEditingDeal={(d)=>{ setEditingDealId(d?.id || null); setIsDealModalOpen(true);}} setIsDealModalOpen={setIsDealModalOpen} />}
                            {activeTab === 'finances' && <FinancesView totalBalance={totalBalance} catBalances={catBalances} transactions={transactions} categories={categories} deleteTx={deleteTx} aiAnalysis={aiAnalysis} aiLoading={aiLoading} handleAiAnalysis={handleAiAnalysis} accounts={accounts} setIsTxModalOpen={setIsTxModalOpen} setEditingTx={setEditingTx} />}
                            {activeTab === 'calculator' && <ProjectCalculator />}
                            {activeTab === 'clients' && <ClientsView clients={clients} setEditingClient={(c)=>{setEditingClient(c); setIsClientModalOpen(true);}} setIsClientModalOpen={setIsClientModalOpen} />}
                            {activeTab === 'tasks' && <TasksView tasks={tasks} toggleTask={toggleTask} deleteDoc={deleteDocRef} user={user} appId={appId} db={db} />}
                            {activeTab === 'settings' && <SettingsView user={user} appId={appId} db={db} accounts={accounts} categories={categories} stages={stages} customFields={customFields} managers={managers} />}
                        </main>
                    </div>

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[300] bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 toast">
                            <CheckCircle2 size={20} className="text-green-400"/>
                            <span className="font-bold text-sm">{toast}</span>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-[300] flex flex-col items-end gap-2">
                        {voiceStatus && <div className="bg-gray-900 text-white px-4 py-2 rounded-2xl shadow-xl text-[10px] font-black uppercase tracking-widest animate-bounce ring-1 ring-white/20">{voiceStatus}</div>}
                        <button type="button" onClick={isListening ? ()=>recognitionRef.current.stop() : startListening} className={`w-16 h-16 rounded-full shadow-2xl flex items-center justify-center transition-all transform active:scale-90 ${isListening ? 'mic-active' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-blue-200'}`}>
                            {isListening ? <MicOff size={24}/> : <Mic size={24}/>}
                        </button>
                    </div>

                    {isDealModalOpen && <Modal title={deals.find(d=>d.id===editingDealId)?.title || "Проект"} onClose={()=>setIsDealModalOpen(false)} width="max-w-6xl"><DealManager user={user} appId={appId} db={db} deal={deals.find(d=>d.id===editingDealId)} stages={stages} clients={clients} customFields={customFields} onClose={()=>setIsDealModalOpen(false)} tasks={tasks.filter(t=>activeDeal && t.dealId===activeDeal.id)} transactions={transactions.filter(t=>activeDeal && t.dealId===activeDeal.id)} categories={categories} accounts={accounts} toggleTask={toggleTask} deleteDeal={deleteDeal} onClose={()=>setIsDealModalOpen(false)} onAddClient={()=>{setIsDealModalOpen(false); setEditingClient(null); setIsClientModalOpen(true);}} deleteTx={deleteTx} /></Modal>}
                    {isClientModalOpen && <Modal title={editingClient ? "Карточка" : "Новый клиент"} onClose={()=>setIsClientModalOpen(false)}><ClientForm user={user} appId={appId} db={db} client={editingClient} onClose={()=>setIsClientModalOpen(false)} /></Modal>}
                    {isTxModalOpen && <Modal title="Операция" onClose={()=>setIsTxModalOpen(false)}><TransactionForm user={user} appId={appId} db={db} categories={categories} accounts={accounts} deals={deals} onClose={()=>setIsTxModalOpen(false)} editingTx={editingTx} /></Modal>}
                    {isHelpModalOpen && <Modal title="Справка" onClose={()=>setIsHelpModalOpen(false)}><div className="p-8 space-y-4"><h3 className="font-bold">План/Факт</h3><p className="text-sm text-gray-500">В финансах используйте статус "План" для будущих трат. Нажмите галочку (или редактировать), чтобы провести операцию.</p></div></Modal>}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
