<head>

    <style>
        body { background-color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; overflow: hidden; }
        .kanban-scroll::-webkit-scrollbar { height: 10px; }
        .kanban-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }

        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .mic-active { animation: pulse-red 1.5s infinite; background-color: #EF4444 !important; border-color: #EF4444 !important; color: white !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .step-segment { height: 8px; border-radius: 4px; background-color: #E5E7EB; flex: 1; cursor: pointer; transition: 0.2s; }
        .step-segment.active { background-color: #3B82F6; }

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as Lucide from 'lucide-react';
        import { initializeApp, getApps, getApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, setDoc, getDoc, query, where, orderBy, documentId, getDocs } from 'firebase/firestore';

        const { 
            LayoutDashboard, Users, Wallet, Settings, X, Briefcase, Phone, Mail, Trash2, Check, 
            CreditCard, Tag, Sparkles, Calculator, Layers, MessageSquare, User, HelpCircle, 
            CheckCircle2, Pencil, Copy, AtSign, Send, Crown, Loader2, Mic, MicOff, Hash, 
            Users2, Lock, Plus, LogOut, Sliders, ChevronRight, FileDown, ExternalLink, ListTodo, Type, Calendar, Pilcrow
        } = Lucide;

        // ==================================================================================
        // ВНИМАНИЕ! ЗАМЕНИТЕ ЭТОТ БЛОК НА ВАШИ ДАННЫЕ ИЗ FIREBASE
        // ==================================================================================
       const firebaseConfig = {
    		apiKey: "AIzaSyDl3vMtK203-TTFJ9KiVx7eHCVoAP1f_X4",
   		authDomain: "crm-a-65f00.firebaseapp.com",
    		projectId: "crm-a-65f00",
    		storageBucket: "crm-a-65f00.appspot.com",
    		messagingSenderId: "427479091195",
    		appId: "1:427479091195:web:fa3cd7b4c5c7dc9a42ad5e",
    		measurementId: "G-R0CNPHZ5R9"
        };
        // ==================================================================================
        
        const appId = 'crm-pro-v1';

        // Firebase Initialization
        let app, auth, db;
        try {
            app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
            auth = getAuth(app);
            db = getFirestore(app);

        // --- HOOKS ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => {
                    setDebouncedValue(value);
                }, delay);
                return () => {
                    clearTimeout(handler);
                };
            }, [value, delay]);
            return debouncedValue;
        }


        // --- HELPER FUNCTIONS ---
        const TAB_NAMES = { kanban: 'Проекты', finances: 'Финансы', clients: 'Клиенты', tasks: 'Задачи', settings: 'Система' };

        const copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => alert('Скопировано!'), () => prompt("Скопируйте вручную:", text));
        };

        // --- ATOMIC COMPONENTS ---
        const Label = ({children}) => <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">{children}</label>;
        const Input = ({ label, ...props }) => (<div className="space-y-1.5 w-full text-left">
            {label && <Label>{label}</Label>}
            <input {...props} className={`w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm ${props.className || ''}`} />
        </div>);
        const Select = ({ label, children, ...props }) => (<div className="space-y-1.5 w-full text-left">
            {label && <Label>{label}</Label>}
            <select {...props} className={`w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none text-sm ${props.className || ''}`}>{children}</select>
        </div>);
        const PrimaryBtn = ({ children, onClick, className = "", ...props }) => (<button onClick={onClick} className={`btn-hover bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-semibold shadow-lg hover:bg-black flex items-center justify-center gap-2 ${className}`} {...props}>{children}</button>);
        const Modal = ({ title, children, onClose, width = "max-w-md" }) => (
            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-md z-[150] flex items-center justify-center p-4" onClick={onClose}>
                <div className={`bg-white rounded-[32px] shadow-2xl w-full ${width} max-h-[95vh] flex flex-col overflow-hidden animate-in zoom-in duration-200`} onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center px-8 py-4 border-b border-gray-100 shrink-0">
                        <h2 className="text-xl font-bold text-gray-900 truncate pr-4 uppercase tracking-tight">{title}</h2>
                        <button onClick={onClose} className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors"><X className="w-5 h-5 text-gray-500" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 no-scrollbar">{children}</div>
                </div>
            </div>
        );
        const NavItem = ({ icon, label, active, onClick, badge }) => (
            <button onClick={onClick} className={`group/nav w-full flex items-center p-3 rounded-2xl transition-all duration-200 mb-1 ${active ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:bg-white/50 hover:text-gray-700'}`}>
                <div className="flex items-center justify-center w-6 h-6 shrink-0"><span className={active ? 'text-blue-600' : 'opacity-70'}>{icon}</span></div>
                <span className="ml-3 font-medium text-sm whitespace-nowrap opacity-0 group-hover/aside:opacity-100 transition-all duration-300">{label}</span>
                {badge > 0 && <span className="ml-auto bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm opacity-0 group-hover/aside:opacity-100">{badge}</span>}
            </button>
        );
        const SettingsCard = ({ title, icon, children }) => (
            <div className="glass-panel rounded-3xl border border-white/50 overflow-hidden shadow-sm mb-6">
                <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/30 flex items-center gap-2 text-gray-900 font-semibold"><div className="text-indigo-600">{icon}</div><h3 className="truncate uppercase text-xs font-black tracking-widest">{title}</h3></div>
                <div className="p-6">{children}</div>
            </div>
        );

        // --- SUB-MODULES ---
        function CompanyIdCard({ user, db, appId, companyCode, setCompanyCode }) {
            const [newCode, setNewCode] = useState(companyCode);
            const handleUpdateCode = async () => {
                const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'general');
                await setDoc(settingsRef, { companyCode: newCode }, { merge: true });
                setCompanyCode(newCode);
                alert("Код компании обновлен!");
            };
            return (
                <SettingsCard title="Код компании" icon={<Hash size={16}/>}>
                    <p className="text-sm mb-4">Этот код позволяет менеджерам и клиентам присоединяться к вашей компании.</p>
                    <div className="flex items-center gap-2">
                        <Input value={newCode || ''} onChange={e => setNewCode(e.target.value)} placeholder="Введите код компании" />
                        <PrimaryBtn onClick={handleUpdateCode}>Сохранить</PrimaryBtn>
                    </div>
                </SettingsCard>
            );
        }
        
        function TeamManager({ user, db, appId, adminId, managers }) {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleAddManager = async (e) => {
                e.preventDefault();
                if(!name || !email || !password || !adminId) return alert("Заполните все поля");
                
                try {
                    // Insecure, should be a cloud function
                    const tempApp = initializeApp(firebaseConfig, `temp-manager-${Date.now()}`);
                    const tempAuth = getAuth(tempApp);
                    const userCredential = await createUserWithEmailAndPassword(tempAuth, email, password);
                    const newManagerUser = userCredential.user;

                    const managerRef = await addDoc(collection(db, 'artifacts', appId, 'users', adminId, 'managers'), {
                        name,
                        email,
                        uid: newManagerUser.uid
                    });

                    await setDoc(doc(db, 'user_profiles', newManagerUser.uid), {
                        role: 'manager',
                        adminId: adminId,
                        managerDocId: managerRef.id
                    });
                    
                    alert(`Менеджер ${name} добавлен.`);
                    setName(''); setEmail(''); setPassword('');
                    await tempAuth.signOut();

                } catch (error) {
                    alert("Ошибка добавления менеджера: " + error.message);
                }
            };

            return (
                <SettingsCard title="Команда" icon={<Users2 size={16}/>}>
                    <div className="space-y-3 mb-4">
                        {managers.map(m => (
                            <div key={m.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <p className="font-semibold">{m.name}</p>
                                    <p className="text-xs text-gray-500">{m.email}</p>
                                </div>
                                <button className="text-red-500 hover:text-red-700"><Trash2 size={16}/></button>
                            </div>
                        ))}
                    </div>
                     <form onSubmit={handleAddManager} className="space-y-3 border-t pt-4">
                        <h4 className="font-bold">Добавить менеджера</h4>
                        <Input value={name} onChange={e => setName(e.target.value)} placeholder="Имя" />
                        <Input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" />
                        <Input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Пароль" />
                        <PrimaryBtn type="submit" className="w-full">Добавить</PrimaryBtn>
                     </form>
                </SettingsCard>
            );
        }

        function CategoriesManager({ adminId, db, appId, categories }) {
            const [newCategoryName, setNewCategoryName] = useState('');
            const [newCategoryType, setNewCategoryType] = useState('expense');

            const handleAddCategory = async () => {
                if (!newCategoryName.trim() || !adminId) return;
                const path = collection(db, 'artifacts', appId, 'users', adminId, 'categories');
                await addDoc(path, { name: newCategoryName, type: newCategoryType });
                setNewCategoryName('');
            };

            const handleDeleteCategory = async (id) => {
                const path = doc(db, 'artifacts', appId, 'users', adminId, 'categories', id);
                await deleteDoc(path);
            };

            return (
                 <SettingsCard title="Категории финансов" icon={<Tag size={16}/>}>
                    <div className="space-y-2 mb-4">
                        {categories.map(c => (
                            <div key={c.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-lg">
                                <span className={`font-medium text-sm ${c.type === 'income' ? 'text-green-600' : 'text-red-600'}`}>{c.name}</span>
                                <button onClick={() => handleDeleteCategory(c.id)} className="text-gray-400 hover:text-red-500"><Trash2 size={14} /></button>
                            </div>
                        ))}
                    </div>
                    <div className="flex items-center gap-2">
                        <Input value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="Новая категория" />
                        <Select value={newCategoryType} onChange={e => setNewCategoryType(e.target.value)}>
                            <option value="expense">Расход</option>
                            <option value="income">Доход</option>
                        </Select>
                        <PrimaryBtn onClick={handleAddCategory}><Plus size={16}/></PrimaryBtn>
                    </div>
                </SettingsCard>
            );
        }

        function CustomFieldsManager({ adminId, db, appId, customFields }) {
            const [fieldName, setFieldName] = useState('');
            const [fieldType, setFieldType] = useState('text');

            const handleAddField = async () => {
                if (!fieldName.trim() || !adminId) return;
                await addDoc(collection(db, 'artifacts', appId, 'users', adminId, 'customFields'), {
                    name: fieldName,
                    type: fieldType,
                    order: customFields.length
                });
                setFieldName('');
            }
            
            const deleteField = async (id) => {
                 await deleteDoc(doc(db, 'artifacts', appId, 'users', adminId, 'customFields', id));
            }

            const getIcon = (type) => {
                if (type === 'text') return <Pilcrow size={14}/>;
                if (type === 'number') return <Hash size={14}/>;
                if (type === 'date') return <Calendar size={14}/>;
            }

            return (
                <SettingsCard title="Дополнительные поля" icon={<Sliders size={16}/>}>
                     <div className="space-y-2 mb-4">
                        {customFields.map(f => (
                            <div key={f.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-lg">
                                <div className="flex items-center gap-2">
                                    <span className="text-gray-400">{getIcon(f.type)}</span>
                                    <span className="font-medium text-sm">{f.name}</span>
                                </div>
                                <button onClick={() => deleteField(f.id)} className="text-gray-400 hover:text-red-500"><Trash2 size={14} /></button>
                            </div>
                        ))}
                    </div>
                    <div className="flex items-center gap-2 border-t pt-4">
                        <Input value={fieldName} onChange={e => setFieldName(e.target.value)} placeholder="Название поля" />
                        <Select value={fieldType} onChange={e => setFieldType(e.target.value)}>
                            <option value="text">Текст</option>
                            <option value="number">Число</option>
                            <option value="date">Дата</option>
                        </Select>
                        <PrimaryBtn onClick={handleAddField}><Plus size={16}/></PrimaryBtn>
                    </div>
                </SettingsCard>
            );
        }


        // --- FORMS ---
        
        function ClientForm({ user, db, client, onClose, managers, userRole, managerDocId, adminId, companyCode }) {
            const [formData, setFormData] = useState(client || { name: '', email: '', phone: '' });
            const [createLogin, setCreateLogin] = useState(false);
            const [loginPassword, setLoginPassword] = useState('');

            const handleChange = (field, value) => setFormData(prev => ({...prev, [field]: value}));
            
            const handlePhoneChange = (e) => {
                let value = e.target.value;
                if (!value) {
                    handleChange('phone', '+7');
                    return;
                }
                if (value.startsWith('+7')) {
                     handleChange('phone', value);
                } else if (value.startsWith('+')) {
                     handleChange('phone', value);
                }
                else {
                    handleChange('phone', '+7' + value.replace(/[^0-9]/g, ''));
                }
            }
            
            const handleSave = async () => {
                if (!formData.name || !adminId) return alert("Имя клиента - обязательное поле");
                
                const clientCollection = collection(db, 'artifacts', appId, 'users', adminId, 'clients');
                
                try {
                    if (formData.id) { // Editing existing client
                        const clientRef = doc(clientCollection, formData.id);
                        await updateDoc(clientRef, formData);
                    } else { // Creating new client
                        const newClientRef = await addDoc(clientCollection, { ...formData, createdAt: serverTimestamp() });

                        if (createLogin && formData.email && loginPassword) {
                           // NOTE: In a real app, this should be a cloud function for security reasons.
                           try {
                                const tempApp = initializeApp(firebaseConfig, `temp-client-${Date.now()}`);
                                const tempAuth = getAuth(tempApp);
                                const userCredential = await createUserWithEmailAndPassword(tempAuth, formData.email, loginPassword);
                                const newClientUser = userCredential.user;

                                // Create role document
                                await setDoc(doc(db, 'user_profiles', newClientUser.uid), {
                                    role: 'client',
                                    adminId: adminId,
                                    clientId: newClientRef.id
                                });
                                
                                // Link uid to client doc
                                await updateDoc(newClientRef, { uid: newClientUser.uid });
                                
                                alert("Клиент и его аккаунт успешно созданы!");
                                await tempAuth.signOut();

                           } catch (authError) {
                               alert("Ошибка создания аккаунта клиента: " + authError.message);
                           }
                        }
                    }
                    onClose();
                } catch (e) {
                    alert("Ошибка сохранения клиента: " + e.message);
                }
            };

            return (
                <div className="p-8 space-y-4">
                    <Input label="Имя *" value={formData.name || ''} onChange={e => handleChange('name', e.target.value)} />
                    <Input label="Email" type="email" value={formData.email || ''} onChange={e => handleChange('email', e.target.value)} />
                    <Input 
                        label="Телефон" 
                        value={formData.phone || ''}
                        onFocus={() => !formData.phone && handleChange('phone', '+7')}
                        onChange={handlePhoneChange} 
                    />
                    
                    {!client?.id && (
                        <div className="pt-4 border-t">
                            <label className="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked={createLogin} onChange={e => setCreateLogin(e.target.checked)} />
                                <span className="text-sm font-medium">Создать аккаунт для входа</span>
                            </label>
                            {createLogin && (
                                <div className="mt-4 space-y-2 animate-in fade-in duration-300">
                                    <p className="text-xs text-gray-500">Клиент сможет входить в систему с указанным Email и паролем, чтобы отслеживать свои проекты.</p>
                                    <Input label="Пароль для клиента" type="password" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="Придумайте пароль" />
                                </div>
                            )}
                        </div>
                    )}

                    <PrimaryBtn onClick={handleSave} className="w-full py-4 uppercase font-black text-xs tracking-widest">Сохранить</PrimaryBtn>
                </div>
            );
        }

        function TransactionForm({ onClose, adminId, db, appId, categories, accounts, dealId }) {
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense');
            const [categoryId, setCategoryId] = useState('');
            const [accountId, setAccountId] = useState('');
            const [description, setDescription] = useState('');
            const [date, setDate] = useState(new Date().toISOString().slice(0, 10));

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!amount || !type || !date || !adminId) {
                    alert("Пожалуйста, заполните все обязательные поля.");
                    return;
                }
                const collectionPath = dealId 
                    ? collection(db, 'artifacts', appId, 'users', adminId, 'deals', dealId, 'transactions')
                    : collection(db, 'artifacts', appId, 'users', adminId, 'transactions');
                
                const data = { amount: Number(amount), type, categoryId, accountId, description, date, createdAt: serverTimestamp(), dealId: dealId || null };
                await addDoc(collectionPath, data);
                if (dealId) {
                    await addDoc(collection(db, 'artifacts', appId, 'users', adminId, 'transactions'), data);
                }

                onClose();
            };
            
            const filteredCategories = useMemo(() => categories.filter(c => c.type === type), [categories, type]);
            
            useEffect(() => {
                setCategoryId(filteredCategories[0]?.id || '');
            }, [type, filteredCategories]);

            return (
                <form onSubmit={handleSubmit} className="p-8 space-y-4">
                    <div className="grid grid-cols-2 gap-4">
                        <Input label="Сумма *" type="number" value={amount} onChange={e => setAmount(e.target.value)} required />
                        <Input label="Дата *" type="date" value={date} onChange={e => setDate(e.target.value)} required />
                    </div>
                    <Select label="Тип операции" value={type} onChange={e => setType(e.target.value)}>
                        <option value="expense">Расход</option>
                        <option value="income">Доход</option>
                    </Select>
                    <Select label="Категория" value={categoryId} onChange={e => setCategoryId(e.target.value)}>
                        <option value="">Без категории</option>
                        {filteredCategories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </Select>
                    <Select label="Счет" value={accountId} onChange={e => setAccountId(e.target.value)}>
                        <option value="">Без счета</option>
                        {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                    </Select>
                    <div>
                        <Label>Описание</Label>
                        <textarea value={description} onChange={e => setDescription(e.target.value)} className="w-full border border-gray-200 rounded-xl p-2.5 outline-none min-h-[100px]"></textarea>
                    </div>
                    <PrimaryBtn type="submit" className="w-full py-4 uppercase font-black text-xs tracking-widest">Сохранить</PrimaryBtn>
                </form>
            );
        }

        function DealComments({ adminId, db, appId, dealId, user }) {
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");

            useEffect(() => {
                if (!dealId) return;
                const q = query(collection(db, 'artifacts', appId, 'users', adminId, 'deals', dealId, 'comments'), orderBy('createdAt', 'asc'));
                const unsub = onSnapshot(q, snap => {
                    setComments(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                return unsub;
            }, [dealId, adminId, appId]);

            const handleAddComment = async () => {
                if (!newComment.trim() || !dealId) return;
                await addDoc(collection(db, 'artifacts', appId, 'users', adminId, 'deals', dealId, 'comments'), {
                    text: newComment,
                    createdAt: serverTimestamp(),
                    author: user.email
                });
                setNewComment("");
            }
            
            return (
                <div className="p-1 h-full flex flex-col">
                    <div className="flex-1 space-y-4 overflow-y-auto no-scrollbar pr-2">
                        {comments.map(comment => (
                            <div key={comment.id} className="bg-gray-100 rounded-lg p-3">

            const dealRef = useRef(null);

            useEffect(() => {
                const initial = initialDeal || { title: '', value: '', clientId: '', managerId: userRole === 'manager' ? managerDocId : '', stageId: stages[0]?.id || '', customData: {} };
                setDeal(initial);

                } else {
                    dealRef.current = null;
                }
            }, [initialDeal, stages, userRole, managerDocId]);

            useEffect(() => {
                const autoSave = async () => {
                    if (dealRef.current && initialDeal) { // Only auto-save existing deals
                        await updateDoc(dealRef.current, { ...debouncedDeal, value: Number(debouncedDeal.value || 0) });
                    }
                };
                autoSave();
            }, [debouncedDeal, adminId, initialDeal]);

                const updatedDeal = {...deal, [field]: value};

        function VoiceAssistant({ openNewDealModal }) {
            const [isListening, setIsListening] = useState(false);
            const recognitionRef = useRef(null);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.warn("Speech Recognition not supported by this browser.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.interimResults = false;
                recognition.continuous = false;

                recognition.onresult = (event) => {
                    const command = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                    console.log("Recognized:", command);
                    if (command.includes('создать проект') || command.includes('новый проект')) {
                        openNewDealModal();
                    } else {
                        alert(`Команда не распознана: "${command}"`);
                    }
                    setIsListening(false);
                };
                recognition.onerror = (event) => {
                    console.error("Speech recognition error:", event.error);
                    setIsListening(false);
                };
                recognition.onend = () => setIsListening(false);
                recognitionRef.current = recognition;
            }, [openNewDealModal]);

            const handleMicClick = () => {
                if (!recognitionRef.current) return alert("Голосовой помощник не поддерживается в вашем браузере.");
                if (isListening) {
                    recognitionRef.current.stop();
                } else {
                    try {
                        recognitionRef.current.start();
                        setIsListening(true);
                    } catch (e) {
                        console.error("Could not start recognition:", e);
                    }
                }
            };
            
            return (
                <button onClick={handleMicClick} className={`w-11 h-11 flex items-center justify-center rounded-full border transition-all ${isListening ? 'mic-active' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-100'}`}>
                    {isListening ? <Mic size={20} /> : <MicOff size={20} />}
                </button>
            );
        }

            const [isDealModalOpen, setIsDealModalOpen] = useState(false);
            const [editingDeal, setEditingDeal] = useState(null);
            const [isClientModalOpen, setIsClientModalOpen] = useState(false);
            const [editingClient, setEditingClient] = useState(null);
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);

            const openDealModal = (deal) => {
                setEditingDeal(deal);
                setIsDealModalOpen(true);
            };
            const closeDealModal = () => {
                setIsDealModalOpen(false);
                setEditingDeal(null);
            };
            
            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        const roleDocRef = doc(db, 'user_profiles', u.uid);
                        const roleDocSnap = await getDoc(roleDocRef);
                        const roleData = roleDocSnap.data();
                        if (roleData) {
                            setUser(u);
                            setUserRole(roleData.role);
                            setAdminId(roleData.role === 'admin' ? u.uid : roleData.adminId);
                            setManagerDocId(roleData.managerDocId || null);
                            setClientId(roleData.clientId || null);
                        } else {
                            // First time login, could be admin or other role based on company code logic not implemented here
                            await setDoc(roleDocRef, { role: 'admin', adminId: u.uid });
                            setUser(u); setUserRole('admin'); setAdminId(u.uid);
                        }
                    } else {
                        // Reset all state on logout
                        setUser(null); setUserRole(null); setAdminId(null); setManagerDocId(null); setClientId(null);
                        setStages([]); setDeals([]); setTasks([]); setClients([]); setCategories([]); setAccounts([]);
                        setTransactions([]); setCustomFields([]); setManagers([]); setClientData({ deals: [], stages: [] });
                    }
                    setLoadingAuth(false);
                });
                return () => unsub();
            }, []);

             useEffect(() => {
                let subscriptions = [];
                const cleanup = () => subscriptions.forEach(unsub => unsub());

                if (adminId) {
                    cleanup();
                    const getPath = (c) => collection(db, 'artifacts', appId, 'users', adminId, c);
                    
                    if (userRole === 'admin' || userRole === 'manager') {
                        subscriptions = [
                            onSnapshot(query(getPath('stages'), orderBy('order')), s => setStages(s.docs.map(d => ({ id: d.id, ...d.data() })))) ,
                            onSnapshot(getPath('deals'), s => setDeals(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(query(getPath('tasks'), orderBy('createdAt', 'desc')), s => setTasks(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(getPath('clients'), s => setClients(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(getPath('categories'), s => setCategories(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(getPath('accounts'), s => setAccounts(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(query(getPath('transactions'), orderBy('date', 'desc')), s => setTransactions(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(query(getPath('customFields'), orderBy('order')), s => setCustomFields(s.docs.map(d => ({id:d.id, ...d.data()})))),
                            onSnapshot(getPath('managers'), s => setManagers(s.docs.map(d => ({id:d.id, ...d.data()}))))
                        ];
                        getDoc(doc(db, 'artifacts', appId, 'users', adminId, 'settings', 'general')).then(snap => {
                            if (snap.exists()) setCompanyCode(snap.data().companyCode);
                        });
                    } else if (userRole === 'client' && clientId) {
                        // For clients, we fetch their deals and all stages for the timeline view.
                        // This requires Firestore rules to allow clients to read the 'stages' collection.
                        const dealsQuery = query(getPath('deals'), where('clientId', '==', clientId));
                        const dealsUnsub = onSnapshot(dealsQuery, snap => {
                            setClientData(prev => ({ ...prev, deals: snap.docs.map(d => ({ id: d.id, ...d.data() })) }));
                        });

                        const stagesQuery = query(getPath('stages'), orderBy('order'));
                        const stagesUnsub = onSnapshot(stagesQuery, snap => {
                             setClientData(prev => ({ ...prev, stages: snap.docs.map(d => ({ id: d.id, ...d.data() })) }));
                        });

                        subscriptions.push(dealsUnsub, stagesUnsub);
                    }
                }
                return cleanup;
            }, [adminId, userRole, clientId]);

            const visibleDeals = useMemo(() => (userRole === 'manager' ? deals.filter(deal => deal.managerId === managerDocId) : deals), [deals, userRole, managerDocId]);
            const visibleClients = useMemo(() => (userRole === 'manager' ? clients.filter(c => c.managerId === managerDocId) : clients), [clients, userRole, managerDocId]);
            
            const deleteDeal = async (id) => { 
                if(adminId && confirm("Удалить проект?")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', adminId, 'deals', id)); 
                    closeDealModal(); 
                }
            };
            const deleteClient = async (id) => {
                 if(confirm("Удалить клиента?") && adminId) {
                     const clientToDelete = clients.find(c=>c.id === id);
                     try {
                        if(clientToDelete?.uid) await deleteDoc(doc(db, 'user_profiles', clientToDelete.uid));
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', adminId, 'clients', id));
                     } catch(e) { alert("Ошибка удаления: " + e.message)}
                 }
             };

            if (loadingAuth) return <div className="h-screen flex items-center justify-center bg-gray-50"><Loader2 className="animate-spin text-blue-600" size={48}/></div>;

            if (userRole === 'client') {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-2xl bg-white rounded-[32px] p-8 shadow-xl animate-in zoom-in duration-300">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-2xl font-black">Мои заказы</h1>
                                <button onClick={() => signOut(auth)} className="text-red-500 font-bold uppercase text-[10px]">Выход</button>
                            </div>
                            {clientData.deals.length > 0 ? clientData.deals.map(deal => {
                                const currentStageIdx = clientData.stages.findIndex(s => s.id === deal.stageId);
                                return (
                                    <div key={deal.id} className="mb-8 border-b pb-8 last:border-b-0 last:pb-0">
                                        <h2 className="text-xl font-bold mb-6 text-slate-800">{deal.title}</h2>
                                        <div className="space-y-6 mb-8 relative pl-6 border-l-2 border-slate-100 ml-3">
                                            {clientData.stages.map((s, i) => (
                                                <div key={i} className="flex items-center gap-4 relative">
                                                    <div className={`absolute -left-[29px] w-6 h-6 rounded-full border-4 border-white shadow-sm flex items-center justify-center ${i <= currentStageIdx ? 'bg-blue-600' : 'bg-slate-200'}`}>
                                                        {i <= currentStageIdx && <Check size={12} className="text-white" />}
                                                    </div>
                                                    <div className={`text-sm font-medium ${i <= currentStageIdx ? 'text-slate-900 font-bold' : 'text-slate-400'}`}>{s.name}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="bg-slate-900 text-white p-6 rounded-2xl text-center">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-widest">К оплате</div>
                                            <div className="text-3xl font-black tracking-tight">{Number(deal.value || 0).toLocaleString()} ₽</div>
                                        </div>
                                    </div>
                                );
                            }) : <p className="text-center text-gray-400 py-10">У вас пока нет заказов.</p>}
                        </div>
                    </div>
                );
            }

            if (!user) return <AuthScreen auth={auth} />;
            
            return (
                <div className="flex h-screen overflow-hidden relative selection:bg-blue-100">
                    <aside className="group/aside w-20 hover:w-64 transition-all duration-300 ease-in-out glass flex flex-col shrink-0 z-50 border-r border-slate-200/50 overflow-hidden">
                        <div className="h-20 flex items-center justify-center md:justify-start md:px-8 border-b border-slate-100"><div className="bg-slate-900 p-2 rounded-2xl text-white shadow-lg shrink-0"><Briefcase size={24}/></div><span className="ml-3 font-black text-2xl tracking-tighter uppercase opacity-0 group-hover/aside:opacity-100 transition-opacity duration-300 whitespace-nowrap">ProCRM</span></div>
                        <nav className="flex-1 mt-10 px-4 space-y-1">
                            <NavItem icon={<LayoutDashboard size={22}/>} label="Проекты" active={activeTab === 'kanban'} onClick={()=>setActiveTab('kanban')} />
                            <NavItem icon={<Wallet size={22}/>} label="Финансы" active={activeTab === 'finances'} onClick={()=>setActiveTab('finances')} />
                            <NavItem icon={<ListTodo size={22}/>} label="Задачи" active={activeTab === 'tasks'} onClick={()=>setActiveTab('tasks')} />
                            <NavItem icon={<Users size={22}/>} label="Клиенты" active={activeTab === 'clients'} onClick={()=>setActiveTab('clients')} badge={visibleClients.length} />
                            {userRole === 'admin' && <NavItem icon={<Settings size={22}/>} label="Система" active={activeTab === 'settings'} onClick={()=>setActiveTab('settings')} />}
                        </nav>
                        <div className="p-4 border-t border-slate-100 text-center shrink-0"><button onClick={()=>signOut(auth)} className="text-slate-400 hover:text-red-500 transition-colors font-black text-[10px] flex items-center justify-center gap-1 w-full py-4 hover:bg-red-50 rounded-2xl uppercase tracking-widest"><LogOut size={16}/> <span className="opacity-0 group-hover/aside:opacity-100 transition-opacity duration-300 ml-2">Выход</span></button></div>
                    </aside>

                    <div className="flex-1 flex flex-col min-w-0 bg-[#F5F5F7]">
                        <header className="h-20 flex items-center justify-between px-10 shrink-0 bg-white/50 backdrop-blur-md z-10 border-b">
                            <h1 className="text-2xl font-black text-slate-900 tracking-tight uppercase truncate">{TAB_NAMES[activeTab]}</h1>
                             <div className="flex items-center gap-4">
                                {activeTab === 'kanban' && <PrimaryBtn onClick={() => openDealModal(null)}><Plus size={18}/> Проект</PrimaryBtn>}
                                {activeTab === 'finances' && <PrimaryBtn onClick={()=> setIsTransactionModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-700 shadow-emerald-100"><Plus size={18}/> Операция</PrimaryBtn>}
                                {active_tab === 'clients' && <PrimaryBtn onClick={()=>{setEditingClient(null); setIsClientModalOpen(true);}} className="bg-blue-600 hover:bg-blue-700 shadow-blue-100"><Plus size={18}/> Клиент</PrimaryBtn>}
                                <VoiceAssistant openNewDealModal={() => openDealModal(null)} />
                            </div>
                        </header>
                        <main className="flex-1 overflow-auto p-10 pt-4 relative no-scrollbar">
                           {activeTab === 'kanban' && <KanbanView stages={stages} deals={visibleDeals} clients={clients} openDealModal={openDealModal} managers={managers} userRole={userRole} />}
                           {activeTab === 'finances' && <FinancesView transactions={transactions} accounts={accounts} categories={categories} adminId={adminId} db={db} appId={appId} />}
                           {activeTab === 'tasks' && <TasksView tasks={tasks} adminId={adminId} db={db} appId={appId} />}
                           {activeTab === 'clients' && <ClientsView clients={visibleClients} setEditingClient={(c)=>{setEditingClient(c); setIsClientModalOpen(true);}} deleteClient={deleteClient} managers={managers} userRole={userRole} />}
                           {activeTab === 'settings' && userRole === 'admin' && <SettingsView user={user} appId={appId} db={db} managers={managers} companyCode={companyCode} setCompanyCode={setCompanyCode} customFields={customFields} categories={categories} />}
                        </main>
                    </div>
                    
                    {isDealModalOpen && 
                        <Modal 
                            title={editingDeal?.id ? 'Карточка проекта' : 'Новый проект'}
                            onClose={closeDealModal}
                            width={'max-w-5xl'}
                        >
                            <DealCard 
                                deal={editingDeal} 
                                onClose={closeDealModal}
                                {...{adminId, db, appId, clients, managers, stages, customFields, userRole, managerDocId, deleteDeal, user}}
                            />
                        </Modal>
                    }

                    {isClientModalOpen && <Modal title={editingClient ? "Карточка клиента" : "Новый клиент"} onClose={()=>{setIsClientModalOpen(false); setEditingClient(null);}}><ClientForm user={user} db={db} client={editingClient} onClose={()=>{setIsClientModalOpen(false); setEditingClient(null);}} managers={managers} userRole={userRole} managerDocId={managerDocId} adminId={adminId} companyCode={companyCode} /></Modal>}
                    {isTransactionModalOpen && <Modal title="Новая операция" onClose={()=>setIsTransactionModalOpen(false)}><TransactionForm onClose={()=>setIsTransactionModalOpen(false)} {...{adminId, db, appId, categories, accounts}} /></Modal>}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
